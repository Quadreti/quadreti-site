<script>
(function(){
  var MDP = 'qua=dre22TI2008proJet+';
  var CLE = 'quadretiAccesPreview';
  if (localStorage.getItem(CLE) === '1') return;
  document.documentElement.style.visibility = 'hidden';
  document.addEventListener('DOMContentLoaded', function(){
    var voile = document.createElement('div');
    voile.style.cssText = 'position:fixed;inset:0;z-index:999999;background:#2B353E;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-family:sans-serif;color:#fff;padding:20px;text-align:center;';
    voile.innerHTML = '<div style="font-size:15px;">Site en pr\u00e9paration \u2014 acc\u00e8s r\u00e9serv\u00e9</div>' +
      '<form id="qdtFormAcces" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;"><input type="password" id="qdtMdp" placeholder="Mot de passe" autocomplete="off" style="padding:10px 14px;border-radius:8px;border:none;font-size:14px;min-width:200px;"><button type="submit" style="padding:10px 18px;border-radius:8px;border:none;background:#E2725B;color:#fff;font-weight:700;cursor:pointer;">Entrer</button></form>' +
      '<div id="qdtErreur" style="color:#ffb4a6;font-size:12px;display:none;">Mot de passe incorrect.</div>';
    document.body.appendChild(voile);
    document.documentElement.style.visibility = 'visible';
    document.getElementById('qdtMdp').focus();
    document.getElementById('qdtFormAcces').addEventListener('submit', function(e){
      e.preventDefault();
      if (document.getElementById('qdtMdp').value === MDP){
        try { localStorage.setItem(CLE, '1'); } catch(err){}
        voile.remove();
      } else {
        document.getElementById('qdtErreur').style.display = 'block';
        document.getElementById('qdtMdp').value = '';
        document.getElementById('qdtMdp').focus();
      }
    });
  });
})();
</script>

<script>
/* ================= Backend (même base que panneau-site.html) ================= */
var SB_URL = 'https://dxpwkdzofwcxzolwdggp.supabase.co';
var SB_KEY = 'sb_publishable_EKu_a0eDzPrlkf5W6CuBzg_cxZtSlab';
var FN_UPLOAD = SB_URL + '/functions/v1/televerser-fichier';
var CLE_SESSION = 'quadretiPanneauV2Session';
var $ = function(id){ return document.getElementById(id); };
var phrase = null;
var reglages = {};

function toast(msg, erreur){
  var t = $('toast'); t.textContent = msg;
  t.className = 'on' + (erreur ? ' erreur' : '');
  clearTimeout(t._m); t._m = setTimeout(function(){ t.className=''; }, 3200);
}
function enteteAnon(){ return { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' }; }
function rpc(nom, corps){
  return fetch(SB_URL + '/rest/v1/rpc/' + nom, { method:'POST', headers: enteteAnon(), body: JSON.stringify(corps) })
    .then(function(r){ return r.json().then(function(d){ return { ok:r.ok, d:d }; }); });
}
function televerserFichier(fichier, chemin){
  var fd = new FormData();
  fd.append('phrase', phrase); fd.append('chemin', chemin); fd.append('fichier', fichier);
  return fetch(FN_UPLOAD, { method:'POST', body: fd })
    .then(function(r){ return r.json().then(function(d){ return { ok:r.ok, d:d }; }); });
}

function connexionPhrase(){
  var p = $('champPhrase').value;
  if (!p) { toast('Entrez la phrase secrète.', true); return; }
  rpc('verifier_phrase_panneau', { p_phrase: p }).then(function(res){
    if (!res.ok || res.d !== true) { toast('Phrase incorrecte.', true); return; }
    phrase = p; sessionStorage.setItem(CLE_SESSION, p);
    entrerDansPanneau();
  }).catch(function(){ toast('Connexion impossible.', true); });
}
function deconnexion(){
  phrase = null; sessionStorage.removeItem(CLE_SESSION);
  $('blocPanneau').classList.add('cache'); $('blocConnexion').classList.remove('cache'); $('champPhrase').value = '';
}
function entrerDansPanneau(){
  $('blocConnexion').classList.add('cache'); $('blocPanneau').classList.remove('cache');
  chargerReglages();
}
function chargerReglages(){
  return fetch(SB_URL + '/rest/v1/reglages_site?select=cle,valeur', { headers: enteteAnon() })
    .then(function(r){ return r.json(); })
    .then(function(lignes){
      reglages = {};
      (lignes||[]).forEach(function(l){ reglages[l.cle] = l.valeur; });
      construireSommaire();
      afficherSection('bandeau_video');
    });
}
function enregistrer(cle, valeur){
  return rpc('enregistrer_reglage_admin', { p_cle: cle, p_valeur: valeur, p_phrase: phrase }).then(function(res){
    if (res.ok && res.d === true) { reglages[cle] = valeur; toast('Enregistré — en ligne immédiatement.'); }
    else if (res.ok && res.d === false) { toast('Session expirée : reconnectez-vous.', true); deconnexion(); }
    else toast('Échec de l\'enregistrement.', true);
  }).catch(function(){ toast('Échec de l\'enregistrement (réseau).', true); });
}

/* ================= Historique / undo ================= */
function formaterDelai(iso){
  var s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return 'à l\'instant';
  if (s < 3600) return 'il y a ' + Math.floor(s / 60) + ' min';
  if (s < 86400) return 'il y a ' + Math.floor(s / 3600) + ' h';
  return 'il y a ' + Math.floor(s / 86400) + ' j';
}
/* Widget générique attaché à une carte : propose de revenir à la valeur d'avant le
   dernier enregistrement. Marche pour n'importe quelle cle sans code supplémentaire —
   même table d'historique, alimentée automatiquement par un trigger côté base. */
function chargerHistorique(cle, idConteneur, rendreDeNouveau){
  var conteneur = $(idConteneur);
  if (!conteneur) return;
  conteneur.innerHTML = '<span>Historique…</span>';
  rpc('lister_historique_reglage', { p_cle: cle, p_phrase: phrase, p_limite: 1 }).then(function(res){
    if (!res.ok || !res.d || !res.d.length) { conteneur.innerHTML = '<span>Aucun changement enregistré avant celui-ci.</span>'; return; }
    var ancien = res.d[0];
    conteneur.innerHTML = '<span>Version précédente : ' + formaterDelai(ancien.enregistre_le) + '</span> · <button class="lien" id="btnRestaurer">Revenir à cette version</button>';
    $('btnRestaurer').onclick = function(){
      var btn = this; btn.disabled = true; btn.textContent = 'Restauration…';
      envoyerApercu(cle, ancien.valeur);
      enregistrer(cle, ancien.valeur).then(function(){ rendreDeNouveau(); });
    };
  }).catch(function(){ conteneur.innerHTML = '<span>Historique indisponible (réseau).</span>'; });
}

var apercuPret = false;
var VUES = {
  mobile:  { largeur:375,  hauteur:700, echelleCol:296 },
  desktop: { largeur:1280, hauteur:760, echelleCol:296 }
};
var vueActuelle = 'mobile';
function dimensionnerIframe(){
  var v = VUES[vueActuelle];
  var echelle = v.echelleCol / v.largeur;
  var f = $('apercuFrame');
  f.style.width = v.largeur + 'px';
  f.style.height = v.hauteur + 'px';
  f.style.transform = 'scale(' + echelle + ')';
  $('porteIframe').style.width = Math.round(v.largeur * echelle) + 'px';
  $('porteIframe').style.height = Math.round(v.hauteur * echelle) + 'px';
}
function basculerVue(v){
  vueActuelle = v;
  $('vueMobile').classList.toggle('actif', v === 'mobile');
  $('vueDesktop').classList.toggle('actif', v === 'desktop');
  dimensionnerIframe();
}
function ouvrirGrand(){ window.open('index.html', '_blank'); }
window.addEventListener('message', function(ev){
  if (ev.source !== $('apercuFrame').contentWindow) return;
  if (ev.data && ev.data.type === 'qz-apercu-pret') {
    apercuPret = true;
    $('liveDot').classList.add('pret');
    $('apercuStatut').textContent = 'Se met à jour à chaque changement';
  }
});
function envoyerApercu(cle, valeur){
  if (!apercuPret) return;
  try { $('apercuFrame').contentWindow.postMessage({ type:'qz-apercu-patch', cle:cle, valeur:valeur }, location.origin); } catch(e){}
}

        '<button class="btn-icone" data-descendre="' + i + '"' + (i === etat.length - 1 ? ' disabled' : '') + ' title="Descendre">↓</button>' +
        '<button class="btn-icone suppr" data-suppr="' + i + '" title="Retirer">✕</button>' +
      '</div></div>';
    }).join('');

    $('editeur').innerHTML =
      '<p class="fil">Footer &amp; légal <span style="opacity:.5">/</span> <b>Réseaux sociaux</b></p>' +
      '<h1 class="titre-section">Réseaux sociaux</h1>' +

    document.querySelectorAll('[data-descendre]').forEach(function(b){ b.onclick = function(){ var i = +b.dataset.descendre; var t = etat[i+1]; etat[i+1] = etat[i]; etat[i] = t; dessiner(); }; });
    document.querySelectorAll('[data-suppr]').forEach(function(b){ b.onclick = function(){ etat.splice(+b.dataset.suppr, 1); dessiner(); }; });

    chargerHistorique('reseaux_liste', 'histo-reseaux_liste', rendreSectionReseaux);
  }

  dessiner();
}

/* Palette maîtresse : thème + 4 couleurs + sections qui suivent + palettes
   mémorisées + réglages fins (11 zones). Important : on part toujours de
   reglages.couleurs existant et on ne modifie QUE les champs édités ici, pour ne
   jamais effacer un réglage qu'on n'a pas touché (l'enregistrement remplace l'objet
   entier côté base, pas une fusion). */
/* Remaniement du 28/08 : les anciens champs 'cartouches', 'carte', 'encartFond',
   'encartTexte', 'enumeration' et 'texteDoux' sont retires -- ils faisaient
   doublon ou, pire, couvraient des zones DIFFERENTES avec la MEME couleur
   (texteDoux appliquait un seul blanc a la fois a des cartes sombres et a
   des cartes blanches jamais reglees ailleurs -- .gift/.premium/.trust-card
   n'avaient meme pas de champ de fond avant ce remaniement, d'ou le texte
   invisible constate). Tout ca fusionne dans le nouveau champ unique
   'arrierePlanTexte' (couvre desormais TOUTES les cartes contenant du texte)
   -- le texte pose dessus est calcule automatiquement pour rester lisible
   (voir couleurLisibleSur dans reglages-site.js), plus besoin d'un champ de
   texte separe pour ca. 'sousTitre' est nouveau (le 3e niveau demande par le
   fondateur : Titre > Sous-titre > Texte). */
var ZONES_FINES = [
  ['menu', 'Bandeau de navigation', 'Haut de page', 'fond'],
  ['boutiqueFond', 'Arrière-plan boutique', 'Page Boutique uniquement', 'fond'],
  ['logo', 'Logo', 'Tesselles + nom, bandeau du haut', 'texte']
];
/* Titre/Sous-titre/Bouton/Arriere-plan-texte sont remontes DANS la carte
   "Palette maitresse" elle-meme (28/08, demande fondateur) -- ce ne sont
   plus des reglages fins avec interrupteur suivre/personnaliser, mais des
   champs a part entiere a cote de Fond/Texte/Accent/Survol, toujours
   visibles et explicites. Voir CHAMPS_MAITRES plus bas. */

function rendreSectionPalette(){
  var c = Object.assign({ theme:'actuel', fond:'#F5F5F5', texte:'#2b353e', accent:'#e2725b', survol:'#cf6450' }, reglages.couleurs || {});
  var sec = Object.assign({ bandeau:true, accueil:true, widgets:true }, c.sections || {});
  var palettesMemorisees = reglages.palettes || {};

  function repliCouleur(repli){
    if (repli === 'accent') return c.accent;
    if (repli === 'fond') return c.fond;
    if (repli === 'texte') return c.texte;
    return repli;
  }

  /* Valeurs affichees pour les 4 champs remontes dans la palette maitresse
     (28/08) -- si jamais personnalises, un repli sensible (identique a celui
     deja utilise cote reglages-site.js) plutot qu'un champ vide/noir par
     defaut. Des l'enregistrement, la valeur devient explicite comme les
     autres champs maitres (plus de notion de "suivre" pour ceux-la). */
  var CHAMPS_MAITRES = {
    titre: c.titres || c.titre || c.accent,
    sousTitre: c.sousTitre || c.accent,
    bouton: c.bouton || c.accent,
    arrierePlanTexte: c.arrierePlanTexte || c.carte || c.encartFond || '#ffffff'
  };

  var chipsHtml = [1,2,3,4,5].map(function(n){
    var p = palettesMemorisees[n];
    if (!p) return '<div class="chip vide" data-charger-vide="1"><div class="plus">+</div><div class="nom">Vide</div></div>';
    var pc = p.couleurs || {};
    return '<div class="chip" data-charger-palette="' + n + '">' +
      '<div class="apercu"><span style="background:' + (pc.fond||'#ccc') + '"></span><span style="background:' + (pc.texte||'#ccc') + '"></span><span style="background:' + (pc.accent||'#ccc') + '"></span><span style="background:' + (pc.survol||'#ccc') + '"></span></div>' +
      '<div class="nom">' + escHtml(p.nom || ('Emplacement ' + n)) + '</div><div class="num">Emplacement ' + n + '</div>' +
    '</div>';
  }).join('');

  var zonesHtml = ZONES_FINES.map(function(z){
    var cle = z[0], label = z[1], desc = z[2], repli = z[3];
    var perso = !!c[cle];
    var valeur = c[cle] || repliCouleur(repli);
    return '<div class="zone-fine">' +
      '<div class="zone-txt"><b>' + label + '</b><span>' + desc + '</span></div>' +
      '<div class="zone-droite">' +
        '<div class="rang-couleur-mini" id="zfCouleur_' + cle + '" style="' + (perso ? '' : 'display:none') + '"><input type="color" id="zf_' + cle + '" value="' + valeur + '"><code id="zf_' + cle + 'Hex">' + valeur + '</code></div>' +
        '<button class="interrupteur' + (perso ? '' : ' on') + '" id="zfToggle_' + cle + '" data-zone="' + cle + '" data-repli="' + valeur + '"><i></i></button>' +
      '</div>' +
    '</div>';
  }).join('');

  $('editeur').innerHTML =
    '<p class="fil">Identité visuelle <span style="opacity:.5">/</span> <b>Palette maîtresse</b></p>' +
    '<h1 class="titre-section">Palette maîtresse</h1>' +
    '<p class="aide-section">S\'applique à tout le site.</p>' +

    '<div class="carte">' +
      '<div class="carte-entete"><h2>Palettes mémorisées</h2></div>' +
      '<div class="chips" id="chipsPalettes">' + chipsHtml + '</div>' +
      '<p style="font-size:11.5px;color:var(--doux);margin:10px 0 0">Charger un emplacement remplit le formulaire ci-dessous — à enregistrer ensuite pour l\'appliquer au site.</p>' +
      '<div class="memoriser">' +
        '<label>Mémoriser la composition actuelle</label>' +
        '<div class="memoriser-rang">' +
          '<select id="memSlot">' + [1,2,3,4,5].map(function(n){ return '<option value="' + n + '">Emplacement ' + n + '</option>'; }).join('') + '</select>' +
          '<input type="text" id="memNom" placeholder="Nom (ex. Magazine Déco)" maxlength="24">' +
          '<button id="btnMemoriser">Mémoriser</button>' +
        '</div>' +
      '</div>' +
    '</div>' +

    '<div class="carte">' +
      '<div class="carte-entete"><h2>Thème</h2></div>' +
      '<label class="choix-radio"><input type="radio" name="cTheme" value="actuel"' + (c.theme !== 'magazine' ? ' checked' : '') + '> Actuel (crème / charbon)</label>' +
      '<label class="choix-radio"><input type="radio" name="cTheme" value="magazine"' + (c.theme === 'magazine' ? ' checked' : '') + '> Magazine Déco (lin / terracotta)</label>' +
    '</div>' +

    '<div class="carte">' +
      '<div class="carte-entete"><h2>Couleurs</h2></div>' +
      '<p class="aide-section" style="margin:-4px 0 12px">3 niveaux de texte, 3 niveaux d\'arrière-plan, plus Accent/Survol — tout le reste du site en découle.</p>' +
      '<div class="grille-champs">' +
        '<div class="champ"><label>Titre</label><div class="rang-couleur"><input type="color" id="cTitre" value="' + CHAMPS_MAITRES.titre + '"><code id="cTitreHex">' + CHAMPS_MAITRES.titre + '</code></div></div>' +
        '<div class="champ"><label>Sous-titre</label><div class="rang-couleur"><input type="color" id="cSousTitre" value="' + CHAMPS_MAITRES.sousTitre + '"><code id="cSousTitreHex">' + CHAMPS_MAITRES.sousTitre + '</code></div></div>' +
        '<div class="champ"><label>Texte</label><div class="rang-couleur"><input type="color" id="cTexte" value="' + c.texte + '"><code id="cTexteHex">' + c.texte + '</code></div></div>' +
        '<div class="champ"><label>Général</label><div class="rang-couleur"><input type="color" id="cFond" value="' + c.fond + '"><code id="cFondHex">' + c.fond + '</code></div></div>' +
        '<div class="champ"><label>Bouton</label><div class="rang-couleur"><input type="color" id="cBouton" value="' + CHAMPS_MAITRES.bouton + '"><code id="cBoutonHex">' + CHAMPS_MAITRES.bouton + '</code></div></div>' +
        '<div class="champ"><label>Arrière-plan texte</label><div class="rang-couleur"><input type="color" id="cArrierePlanTexte" value="' + CHAMPS_MAITRES.arrierePlanTexte + '"><code id="cArrierePlanTexteHex">' + CHAMPS_MAITRES.arrierePlanTexte + '</code></div></div>' +
        '<div class="champ"><label>Accent</label><div class="rang-couleur"><input type="color" id="cAccent" value="' + c.accent + '"><code id="cAccentHex">' + c.accent + '</code></div></div>' +
        '<div class="champ"><label>Survol</label><div class="rang-couleur"><input type="color" id="cSurvol" value="' + c.survol + '"><code id="cSurvolHex">' + c.survol + '</code></div></div>' +
      '</div>' +
    '</div>' +

    '<div class="carte">' +
      '<div class="carte-entete"><h2>Sections qui suivent cette palette</h2></div>' +
      '<p class="aide-section" style="margin-bottom:6px">Désactivez une section pour garder ses réglages détaillés (déjà présents dans sa propre carte) au lieu de la palette ci-dessus.</p>' +
      '<div class="toggle-ligne"><div class="toggle-txt"><b>Bandeau &amp; menu</b><span>Fond, logo, bouton menu, sous-menu</span></div><button class="interrupteur' + (sec.bandeau !== false ? ' on' : '') + '" id="secBandeau"><i></i></button></div>' +
      '<div class="toggle-ligne"><div class="toggle-txt"><b>Page d\'accueil</b><span>Baselines du bandeau photo/vidéo</span></div><button class="interrupteur' + (sec.accueil !== false ? ' on' : '') + '" id="secAccueil"><i></i></button></div>' +
      '<div class="toggle-ligne"><div class="toggle-txt"><b>Widgets</b><span>Réassurance, popup de remise</span></div><button class="interrupteur' + (sec.widgets !== false ? ' on' : '') + '" id="secWidgets"><i></i></button></div>' +
    '</div>' +

    '<div class="carte">' +
      '<div class="carte-entete"><h2>Réglages fins</h2></div>' +
      '<p class="compteur-fines">Suivent la palette par défaut (interrupteur activé). Désactivez pour donner une couleur à part à cet élément précis.</p>' +
      zonesHtml +
      '<div class="pied-carte"><div class="historique" id="histo-couleurs"></div><button class="btn-enregistrer" id="cEnregistrer">Enregistrer les couleurs</button></div>' +
    '</div>';

  function draft(){
    var out = Object.assign({}, reglages.couleurs || {});
    out.theme = document.querySelector('input[name=cTheme]:checked').value;
    out.fond = $('cFond').value; out.texte = $('cTexte').value; out.accent = $('cAccent').value; out.survol = $('cSurvol').value;
    out.titres = $('cTitre').value; out.sousTitre = $('cSousTitre').value;
    out.bouton = $('cBouton').value; out.arrierePlanTexte = $('cArrierePlanTexte').value;
    /* Ces 4 champs vivent desormais dans la palette maitresse elle-meme --
       les anciens noms de champs "fins" retires (carte/encartFond/titre au
       singulier) ne doivent plus trainer dans les donnees enregistrees. */
    delete out.carte; delete out.encartFond; delete out.encartTexte; delete out.enumeration;
    delete out.cartouches; delete out.texteDoux; delete out.titre;
    out.sections = { bandeau: $('secBandeau').classList.contains('on'), accueil: $('secAccueil').classList.contains('on'), widgets: $('secWidgets').classList.contains('on') };
    ZONES_FINES.forEach(function(z){
      var cle = z[0];
      var toggle = $('zfToggle_' + cle);
      if (toggle.classList.contains('on')) delete out[cle];
      else out[cle] = $('zf_' + cle).value;
    });
    return out;
  }
  function previsualiser(){ envoyerApercu('couleurs', draft()); }

  document.querySelectorAll('input[name=cTheme]').forEach(function(r){ r.onchange = previsualiser; });
  ['cFond','cTexte','cAccent','cSurvol','cTitre','cSousTitre','cBouton','cArrierePlanTexte'].forEach(function(id){
    $(id).oninput = function(){ $(id + 'Hex').textContent = this.value; previsualiser(); };
  });
  ['secBandeau','secAccueil','secWidgets'].forEach(function(id){
    $(id).onclick = function(){ this.classList.toggle('on'); previsualiser(); };
  });
  ZONES_FINES.forEach(function(z){
    var cle = z[0];
    $('zfToggle_' + cle).onclick = function(){
      this.classList.toggle('on');
      $('zfCouleur_' + cle).style.display = this.classList.contains('on') ? 'none' : '';
      previsualiser();
    };
    $('zf_' + cle).oninput = function(){ $('zf_' + cle + 'Hex').textContent = this.value; previsualiser(); };
  });
  document.querySelectorAll('[data-charger-palette]').forEach(function(chip){
    chip.onclick = function(){
      var p = palettesMemorisees[chip.dataset.chargerPalette];
      if (!p || !p.couleurs) return;
      var pc = p.couleurs;
      if (pc.theme) document.querySelector('input[name=cTheme][value="' + pc.theme + '"]').checked = true;
      if (pc.fond) { $('cFond').value = pc.fond; $('cFondHex').textContent = pc.fond; }
      if (pc.texte) { $('cTexte').value = pc.texte; $('cTexteHex').textContent = pc.texte; }
      if (pc.accent) { $('cAccent').value = pc.accent; $('cAccentHex').textContent = pc.accent; }
      if (pc.survol) { $('cSurvol').value = pc.survol; $('cSurvolHex').textContent = pc.survol; }
      toast('Palette « ' + (p.nom || '') + ' » chargée dans le formulaire — Enregistrer pour l\'appliquer.');
      previsualiser();
    };
  });
  $('btnMemoriser').onclick = function(){
    var nom = $('memNom').value.trim();
    if (!nom) { toast('Donnez un nom à cette composition.', true); return; }
    var slot = $('memSlot').value;
    var nouvelles = Object.assign({}, palettesMemorisees);
    nouvelles[slot] = { nom: nom, couleurs: { theme: document.querySelector('input[name=cTheme]:checked').value, fond: $('cFond').value, texte: $('cTexte').value, accent: $('cAccent').value, survol: $('cSurvol').value } };
    enregistrer('palettes', nouvelles).then(function(){ $('memNom').value = ''; rendreSectionPalette(); });
  };
  $('cEnregistrer').onclick = function(){
    var btn = this; btn.disabled = true; btn.textContent = 'Enregistrement…';
    enregistrer('couleurs', draft()).then(function(){ btn.disabled = false; btn.textContent = 'Enregistrer les couleurs'; chargerHistorique('couleurs', 'histo-couleurs', rendreSectionPalette); });
  };
  chargerHistorique('couleurs', 'histo-couleurs', rendreSectionPalette);
}

        '<button type="button" class="btn-texte-ajout" id="pnAjouterExemple">+ Ajouter un exemple</button>' +
        '<div class="pied-carte"><div class="historique" id="histo-pixel_number_app"></div><button class="btn-enregistrer" id="pnEnregistrer">Enregistrer</button></div>' +
      '</div>';

    function draft(){
      return {
        actif: $('pnActif').classList.contains('on'), titre: $('pnTitre').value.trim(), accroche: $('pnAccroche').value.trim(),
        pont_titre: $('pnPontTitre').value.trim(), pont_texte: $('pnPontTexte').value.trim(), pont_lien: $('pnPontLien').value.trim(),
        largeur_defaut: parseInt($('pnLargeur').value, 10) || 28, couleurs_defaut: parseInt($('pnCouleurs').value, 10) || 7,
        url_impression: $('pnUrlImpression').value.trim(), qr_code_url: $('pnQrUrl').value.trim(),
        exemples: pn.exemples || {}
      };
    }

    $('pnActif').onclick = function(){ this.classList.toggle('on'); };
    document.querySelectorAll('input[name=pnTranche]').forEach(function(r){ r.onchange = function(){ pn = draft(); trancheActuelle = this.value; dessiner(); }; });
    $('pnAjouterExemple').onclick = function(){
      pn = draft();
      pn.exemples = Object.assign({}, pn.exemples);
      pn.exemples[trancheActuelle] = (pn.exemples[trancheActuelle] || []).concat([{ nom:'Nouveau sujet', image:'' }]);
      dessiner();
    };
    document.querySelectorAll('[data-ex-monter]').forEach(function(b){ b.onclick = function(){
      pn = draft(); var i = +b.dataset.exMonter; var liste = pn.exemples[trancheActuelle];
      var t = liste[i-1]; liste[i-1] = liste[i]; liste[i] = t; dessiner();
    }; });
    document.querySelectorAll('[data-ex-descendre]').forEach(function(b){ b.onclick = function(){
      pn = draft(); var i = +b.dataset.exDescendre; var liste = pn.exemples[trancheActuelle];
      var t = liste[i+1]; liste[i+1] = liste[i]; liste[i] = t; dessiner();
    }; });
    document.querySelectorAll('[data-ex-suppr]').forEach(function(b){ b.onclick = function(){
      pn = draft(); pn.exemples[trancheActuelle].splice(+b.dataset.exSuppr, 1); dessiner();
    }; });
    document.querySelectorAll('[data-ex-nom]').forEach(function(champ){ champ.oninput = function(){
      pn = draft(); pn.exemples[trancheActuelle][+champ.dataset.exNom].nom = champ.value;
    }; });
    document.querySelectorAll('[data-ex-fichier]').forEach(function(input){
      input.addEventListener('change', function(){
        var f = this.files[0]; if (!f) return;
        if (f.size > 4 * 1024 * 1024) { toast('Image trop lourde (4 Mo max).', true); return; }
        var i = +this.dataset.exFichier;
        var ext = (f.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
        toast('Envoi de l\'image…');
        televerserFichier(f, 'pixel-number-exemple-' + Date.now() + '.' + ext).then(function(res){
          if (!res.ok || !res.d.url) { toast(res.d && res.d.erreur ? res.d.erreur : 'Envoi impossible.', true); return; }
          pn = draft();
          pn.exemples[trancheActuelle][i].image = res.d.url;
          dessiner();
        }).catch(function(){ toast('Envoi impossible (réseau).', true); });
      });
    });

    $('pnEnregistrer').onclick = function(){
      var btn = this; btn.disabled = true; btn.textContent = 'Enregistrement…';
      pn = draft();
      enregistrer('pixel_number_app', pn).then(function(){ btn.disabled = false; btn.textContent = 'Enregistrer'; chargerHistorique('pixel_number_app', 'histo-pixel_number_app', function(){ rendreSectionPixelNumberApp(); }); });
    };
    chargerHistorique('pixel_number_app', 'histo-pixel_number_app', function(){ rendreSectionPixelNumberApp(); });
  }

  dessiner();
}

    '<div class="carte">' +

        '<label class="choix-radio"><input type="radio" name="mnSsDisposition" value="horizontale"' + (mn.sousDisposition === 'horizontale' ? ' checked' : '') + '> Horizontale</label>' +
      '</div>' +
      '<div class="champ" style="margin-top:10px"><label>Alignement du contenu</label>' +
        ['gauche','centre','droite'].map(function(v){ return '<label class="choix-radio"><input type="radio" name="mnSsAlignement" value="' + v + '"' + ((mn.sousAlignement || 'centre') === v ? ' checked' : '') + '> ' + v.charAt(0).toUpperCase() + v.slice(1) + '</label>'; }).join('') +
      '</div>' +
      '<div class="grille-champs" style="margin-top:10px">' +
        '<div class="champ"><label>Texte des liens</label><div class="rang-couleur"><input type="color" id="mnSsTexte" value="' + (mn.sousTexte || '#9aa2a9') + '"><code id="mnSsTexteHex">' + (mn.sousTexte || '') + '</code></div></div>' +

    enregistrer('menu_nav', draft()).then(function(){ btn.disabled = false; btn.textContent = 'Enregistrer'; chargerHistorique('menu_nav', 'histo-menu_nav', rendreSectionMenuNav); });
  };
  chargerHistorique('menu_nav', 'histo-menu_nav', rendreSectionMenuNav);
}

function rendreSectionOrdre(){
  var titres = {}; SECTIONS_ACCUEIL.forEach(function(d){ titres[d[0]] = d[1]; });
  var ordreSauve = (reglages.sections_ordre && reglages.sections_ordre.length) ? reglages.sections_ordre : SECTIONS_ACCUEIL.map(function(d){ return d[0]; });
  var visSauve = reglages.sections_visibilite || {};
  var etat = ordreSauve.filter(function(id){ return titres[id]; }).map(function(id){ return { id:id, visible: visSauve[id] !== false }; });
  SECTIONS_ACCUEIL.forEach(function(d){ if (!etat.some(function(e){ return e.id === d[0]; })) etat.push({ id:d[0], visible: visSauve[d[0]] !== false }); });

  function ordreActuel(){ return etat.map(function(e){ return e.id; }); }
  function visActuelle(){ var v = {}; etat.forEach(function(e){ v[e.id] = e.visible; }); return v; }
  function previsualiser(){ envoyerApercu('sections_ordre', ordreActuel()); envoyerApercu('sections_visibilite', visActuelle()); }

  function dessiner(){
    var lignes = etat.map(function(item, i){
      return '<div class="bloc-repete"><div class="rang-menu" style="grid-template-columns:1fr auto auto auto">' +
        '<div><div style="font-size:13px;font-weight:600">' + escHtml(titres[item.id]) + '</div><div style="font-size:11px;color:var(--doux)">' + item.id + (item.visible ? '' : ' · masquée') + '</div></div>' +
        '<button class="interrupteur' + (item.visible ? ' on' : '') + '" data-vis="' + i + '" title="Visible sur le site"><i></i></button>' +
        '<button class="btn-icone" data-monter="' + i + '"' + (i === 0 ? ' disabled' : '') + ' title="Monter">↑</button>' +
        '<button class="btn-icone" data-descendre="' + i + '"' + (i === etat.length - 1 ? ' disabled' : '') + ' title="Descendre">↓</button>' +
      '</div></div>';
    }).join('');

    $('editeur').innerHTML =
      '<p class="fil">Page d\'accueil <span style="opacity:.5">/</span> <b>Visibilité &amp; ordre</b></p>' +
      '<h1 class="titre-section">Visibilité &amp; ordre des sections</h1>' +
      '<p class="aide-section">L\'ordre d\'affichage des sections de la page d\'accueil, et lesquelles sont visibles. Le contenu de chaque section reste inchangé — seuls la place et l\'affichage bougent.</p>' +
      '<div class="carte">' + lignes + '</div>' +
      '<div class="pied-carte"><div class="historique" id="histo-sections_ordre"></div><button class="btn-enregistrer" id="ordreEnregistrer">Enregistrer</button></div>';

    document.querySelectorAll('[data-vis]').forEach(function(b){ b.onclick = function(){ etat[+b.dataset.vis].visible = !etat[+b.dataset.vis].visible; dessiner(); previsualiser(); }; });
    document.querySelectorAll('[data-monter]').forEach(function(b){ b.onclick = function(){ var i = +b.dataset.monter; var t = etat[i-1]; etat[i-1] = etat[i]; etat[i] = t; dessiner(); previsualiser(); }; });
    document.querySelectorAll('[data-descendre]').forEach(function(b){ b.onclick = function(){ var i = +b.dataset.descendre; var t = etat[i+1]; etat[i+1] = etat[i]; etat[i] = t; dessiner(); previsualiser(); }; });
    $('ordreEnregistrer').onclick = function(){
      var btn = this; btn.disabled = true; btn.textContent = 'Enregistrement…';
      Promise.all([enregistrer('sections_ordre', ordreActuel()), enregistrer('sections_visibilite', visActuelle())]).then(function(){
        btn.disabled = false; btn.textContent = 'Enregistrer';
        chargerHistorique('sections_ordre', 'histo-sections_ordre', rendreSectionOrdre);
      });
    };
    chargerHistorique('sections_ordre', 'histo-sections_ordre', rendreSectionOrdre);
  }

  dessiner();
  previsualiser();
}

function rendreSectionBoutons(){

}

/* Menu actuel du site (les 22 pages), pour ne jamais partir d'un formulaire vide. */
var MENU_PAR_DEFAUT = [
  { texte:'Accueil', lien:'/index.html' },
  { texte:'Comment ça marche', sousMenu:[
    { texte:'Guide de l\'app', lien:'/quadreti-guide-interactif.html' },
    { texte:'Guide de montage', lien:'/quadreti-guide-codification.html' }
  ]},
  { texte:'Boutique', lien:'/boutique/' },
  { texte:'Blog', lien:'/blog/' },
  { texte:'Éditeur Créatif', lien:'/editeur-creatif/' },
  { texte:'Mosaïque Créative', lien:'/mosaique-creative/' },
  { texte:'Jeux & Créativité', sousMenu:[
    { texte:'Pixel Number App', lien:'/pixel-number/' },
    { texte:'Mosaïque Révélée', lien:'/mosaique-revelee/' },
    { texte:'Mandala', lien:'/mandala/' },
    { texte:'Mémo', lien:'/memo/' },
    { texte:'Taquin', lien:'/taquin/' },
    { texte:'SET', lien:'/set/' }
  ]},
  { texte:'Livraison & paiement', lien:'/index.html#livraison' },
  { texte:'FAQ', lien:'/index.html#faq' },
  { texte:'Contact', lien:'/contact.html' }
];
function escHtml(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function rendreSectionMenu(){
  var etat = JSON.parse(JSON.stringify((reglages.menu_liens && reglages.menu_liens.length) ? reglages.menu_liens : []));
  var groupes = [];

  function dessinerListe(){
    if (!etat.length) {
      return '<div class="placeholder-section">Le menu suit encore la version codée dans chaque page (identique partout). <button class="lien" id="menuReprendre">Reprendre le menu actuel comme point de départ</button></div>';
    }
    groupes = etat.filter(function(it){ return !!it.sousMenu; });
    var lignes = etat.map(function(item, i){
      var controles = '<button class="btn-icone" data-monter="' + i + '"' + (i === 0 ? ' disabled' : '') + ' title="Monter">↑</button>' +
        '<button class="btn-icone" data-descendre="' + i + '"' + (i === etat.length - 1 ? ' disabled' : '') + ' title="Descendre">↓</button>' +
        '<button class="btn-icone suppr" data-suppr="' + i + '" title="Retirer">✕</button>';
      if (item.sousMenu) {
        var sousLignes = item.sousMenu.map(function(s, j){
          var optionsSous = '<option value="">Déplacer vers…</option><option value="haut">Remonter en lien principal</option>';
          groupes.forEach(function(g, gi){ if (g !== item) optionsSous += '<option value="g' + gi + '">' + escHtml(g.texte) + '</option>'; });
          optionsSous += '<option value="nouveau">Nouveau groupe…</option>';
          return '<div class="rang-sous">' +
            '<div class="champ"><label>Sous-lien</label><input type="text" data-sous-texte="' + i + ',' + j + '" value="' + escHtml(s.texte) + '"></div>' +
            '<div class="champ"><label>Destination</label><input type="text" data-sous-lien="' + i + ',' + j + '" value="' + escHtml(s.lien) + '"></div>' +
            '<select class="select-deplacer" data-deplacer-sous="' + i + ',' + j + '">' + optionsSous + '</select>' +
            '<button class="btn-icone" data-monter-sous="' + i + ',' + j + '"' + (j === 0 ? ' disabled' : '') + ' title="Monter">↑</button>' +
            '<button class="btn-icone" data-descendre-sous="' + i + ',' + j + '"' + (j === item.sousMenu.length - 1 ? ' disabled' : '') + ' title="Descendre">↓</button>' +
            '<button class="btn-icone suppr" data-suppr-sous="' + i + ',' + j + '" title="Retirer">✕</button>' +
          '</div>';
        }).join('');
        return '<div class="bloc-repete"><div class="rang-menu" style="grid-template-columns:1fr auto auto auto">' +
          '<div class="champ"><label>Groupe</label><input type="text" data-item-texte="' + i + '" value="' + escHtml(item.texte) + '"></div>' +
          controles +
        '</div><div class="bloc-sous">' + sousLignes + '<button class="btn-texte-ajout" data-ajout-sous="' + i + '">+ sous-lien</button></div></div>';
      }
      var optionsItem = '<option value="">Déplacer vers…</option>';
      groupes.forEach(function(g, gi){ optionsItem += '<option value="g' + gi + '">' + escHtml(g.texte) + '</option>'; });
      optionsItem += '<option value="nouveau">Nouveau groupe…</option>';
      return '<div class="bloc-repete"><div class="rang-menu" style="grid-template-columns:1fr 1fr auto auto auto auto">' +
        '<div class="champ"><label>Texte</label><input type="text" data-item-texte="' + i + '" value="' + escHtml(item.texte) + '"></div>' +
        '<div class="champ"><label>Destination</label><input type="text" data-item-lien="' + i + '" value="' + escHtml(item.lien) + '"></div>' +
        '<select class="select-deplacer" data-deplacer-item="' + i + '">' + optionsItem + '</select>' +
        controles +
      '</div></div>';
    }).join('');
    return lignes + '<button class="btn-texte-ajout" id="menuAjouter">+ Ajouter un lien</button> <button class="btn-texte-ajout" id="menuAjouterGroupe">+ Ajouter un groupe (avec sous-menu)</button>';
  }

  function dessiner(){
    $('editeur').innerHTML =
      '<p class="fil">Bandeau &amp; menu <span style="opacity:.5">/</span> <b>Liens du menu</b></p>' +
      '<h1 class="titre-section">Liens du menu</h1>' +
      '<p class="aide-section">Les entrées du menu principal, dans l\'ordre où elles apparaissent — identique sur les 22 pages du site. Les destinations commencent par « / » (ex. <code>/boutique/</code>, <code>/contact.html</code>).</p>' +
      '<div class="carte" id="menuCarte">' + dessinerListe() + '</div>' +
      '<div class="pied-carte"><div class="historique" id="histo-menu_liens"></div><button class="btn-enregistrer" id="menuEnregistrer">Enregistrer le menu</button></div>';
    lier();
    envoyerApercu('menu_liens', etat);
  }

  function lier(){
    var reprendre = $('menuReprendre');
    if (reprendre) reprendre.onclick = function(){ etat = JSON.parse(JSON.stringify(MENU_PAR_DEFAUT)); dessiner(); };
    var ajouter = $('menuAjouter');
    if (ajouter) ajouter.onclick = function(){ etat.push({ texte:'Nouveau lien', lien:'/' }); dessiner(); };
    var ajouterGroupe = $('menuAjouterGroupe');
    if (ajouterGroupe) ajouterGroupe.onclick = function(){ etat.push({ texte:'Nouveau groupe', sousMenu:[{ texte:'Sous-lien', lien:'/' }] }); dessiner(); };
    document.querySelectorAll('[data-monter]').forEach(function(b){ b.onclick = function(){ var i = +b.dataset.monter; var t = etat[i-1]; etat[i-1] = etat[i]; etat[i] = t; dessiner(); }; });
    document.querySelectorAll('[data-descendre]').forEach(function(b){ b.onclick = function(){ var i = +b.dataset.descendre; var t = etat[i+1]; etat[i+1] = etat[i]; etat[i] = t; dessiner(); }; });
    document.querySelectorAll('[data-suppr]').forEach(function(b){ b.onclick = function(){ etat.splice(+b.dataset.suppr, 1); dessiner(); }; });
    document.querySelectorAll('[data-ajout-sous]').forEach(function(b){ b.onclick = function(){ etat[+b.dataset.ajoutSous].sousMenu.push({ texte:'Nouveau sous-lien', lien:'/' }); dessiner(); }; });
    document.querySelectorAll('[data-suppr-sous]').forEach(function(b){ b.onclick = function(){ var p = b.dataset.supprSous.split(','); etat[+p[0]].sousMenu.splice(+p[1], 1); dessiner(); }; });
    /* Monter/descendre un sous-lien DANS son groupe (meme logique que monter/descendre
       un lien principal, juste un cran plus profond -- demande du fondateur, pour ne pas
       devoir retirer/rajouter un sous-lien juste pour le reordonner). */
    document.querySelectorAll('[data-monter-sous]').forEach(function(b){
      b.onclick = function(){
        var p = b.dataset.monterSous.split(','); var i = +p[0], j = +p[1];
        var sm = etat[i].sousMenu; var t = sm[j-1]; sm[j-1] = sm[j]; sm[j] = t; dessiner();
      };
    });
    document.querySelectorAll('[data-descendre-sous]').forEach(function(b){
      b.onclick = function(){
        var p = b.dataset.descendreSous.split(','); var i = +p[0], j = +p[1];
        var sm = etat[i].sousMenu; var t = sm[j+1]; sm[j+1] = sm[j]; sm[j] = t; dessiner();
      };
    });
    /* Deplacer un lien principal vers un groupe existant ou un nouveau groupe --
       corrige un lien mal range sans devoir le retaper a la main. */
    document.querySelectorAll('[data-deplacer-item]').forEach(function(sel){
      sel.onchange = function(){
        var valeur = sel.value;
        if (!valeur) return;
        var i = +sel.dataset.deplacerItem;
        var item = etat[i];
        etat.splice(i, 1);
        if (valeur === 'nouveau') etat.push({ texte:'Nouveau groupe', sousMenu:[{ texte:item.texte, lien:item.lien }] });
        else groupes[+valeur.slice(1)].sousMenu.push({ texte:item.texte, lien:item.lien });
        dessiner();
      };
    });
    /* Deplacer un sous-lien vers un autre groupe, ou le remonter en lien
       principal si erreur de rangement. */
    document.querySelectorAll('[data-deplacer-sous]').forEach(function(sel){
      sel.onchange = function(){
        var valeur = sel.value;
        if (!valeur) return;
        var p = sel.dataset.deplacerSous.split(',');
        var i = +p[0], j = +p[1];
        var sousItem = etat[i].sousMenu[j];
        etat[i].sousMenu.splice(j, 1);
        if (valeur === 'haut') etat.push({ texte: sousItem.texte, lien: sousItem.lien });
        else if (valeur === 'nouveau') etat.push({ texte:'Nouveau groupe', sousMenu:[{ texte:sousItem.texte, lien:sousItem.lien }] });
        else groupes[+valeur.slice(1)].sousMenu.push({ texte:sousItem.texte, lien:sousItem.lien });
        dessiner();
      };
    });
    document.querySelectorAll('[data-item-texte]').forEach(function(c){ c.oninput = function(){ etat[+c.dataset.itemTexte].texte = c.value; envoyerApercu('menu_liens', etat); }; });
    document.querySelectorAll('[data-item-lien]').forEach(function(c){ c.oninput = function(){ etat[+c.dataset.itemLien].lien = c.value; envoyerApercu('menu_liens', etat); }; });
    document.querySelectorAll('[data-sous-texte]').forEach(function(c){ c.oninput = function(){ var p = c.dataset.sousTexte.split(','); etat[+p[0]].sousMenu[+p[1]].texte = c.value; envoyerApercu('menu_liens', etat); }; });
    document.querySelectorAll('[data-sous-lien]').forEach(function(c){ c.oninput = function(){ var p = c.dataset.sousLien.split(','); etat[+p[0]].sousMenu[+p[1]].lien = c.value; envoyerApercu('menu_liens', etat); }; });
    var enr = $('menuEnregistrer');
    if (enr) enr.onclick = function(){
      enr.disabled = true; enr.textContent = 'Enregistrement…';
      enregistrer('menu_liens', etat).then(function(){ enr.disabled = false; enr.textContent = 'Enregistrer le menu'; chargerHistorique('menu_liens', 'histo-menu_liens', rendreSectionMenu); });
    };
    chargerHistorique('menu_liens', 'histo-menu_liens', rendreSectionMenu);
  }

  dessiner();
}

function rendreSectionBandeau(){
  var bv = Object.assign({ actif:true, voile:false, vitesse:0.6, pause_ms:1500 }, reglages.bandeau_video || {});
  var img = Object.assign({}, reglages.images || {});
  var repli = img.bandeau || 'img/bandeau-1-impression.jpg';

  $('editeur').innerHTML =
    '<p class="fil">Bandeau &amp; menu <span style="opacity:.5">/</span> <b>Bandeau : vidéo ou image</b></p>' +
    '<h1 class="titre-section">Bandeau : vidéo ou image</h1>' +
    '<p class="aide-section">Le bandeau d\'accueil peut tourner en vidéo ou rester sur une photo fixe. La photo de repli est aussi celle qui s\'affiche si la vidéo ne charge pas — vous pouvez la changer ici, quel que soit le mode choisi.</p>' +

    '<div class="carte">' +
      '<div class="carte-entete"><h2>Mode d\'affichage</h2></div>' +
      '<div class="toggle-ligne">' +
        '<div class="toggle-txt"><b>Vidéo active</b><span>Désactivé = le bandeau affiche la photo de repli ci-dessous</span></div>' +
        '<button class="interrupteur' + (bv.actif ? ' on' : '') + '" id="bvActif"><i></i></button>' +
      '</div>' +
      '<div class="toggle-ligne">' +
        '<div class="toggle-txt"><b>Voile sombre</b><span>Assombrit légèrement la vidéo pour que le texte ressorte</span></div>' +
        '<button class="interrupteur' + (bv.voile ? ' on' : '') + '" id="bvVoile"><i></i></button>' +
      '</div>' +
    '</div>' +

    '<div class="carte">' +
      '<div class="carte-entete"><h2>Photo de repli</h2></div>' +
      '<div class="rang-image">' +
        '<div class="miniature" id="bvMiniature" style="background-image:url(\'' + repli + '\')"></div>' +
        '<div class="infos">Utilisée quand la vidéo est désactivée, et en secours si elle ne charge pas.<br><label class="btn-fichier">Changer la photo<input type="file" id="bvFichier" accept="image/*"></label></div>' +
      '</div>' +
    '</div>' +

    '<div class="carte">' +
      '<div class="carte-entete"><h2>Fichiers vidéo</h2></div>' +
      '<p class="aide-section" style="margin-bottom:12px">35 Mo max par fichier, format MP4. Le remplacement est visible immédiatement, sans republier sur GitHub.</p>' +
      '<div class="rang-image">' +
        '<video class="miniature" id="bvVideoDesktopApercu" muted autoplay loop playsinline style="object-fit:cover"' + (bv.video_url ? ' src="' + bv.video_url + '"' : '') + '></video>' +
        '<div class="infos">Vidéo grand écran (desktop/tablette).<br><label class="btn-fichier">Changer la vidéo<input type="file" id="bvVideoDesktopFichier" accept="video/mp4"></label></div>' +
      '</div>' +
      '<div class="rang-image" style="margin-top:14px">' +
        '<video class="miniature" id="bvVideoMobileApercu" muted autoplay loop playsinline style="object-fit:cover"' + (bv.video_url_mobile ? ' src="' + bv.video_url_mobile + '"' : '') + '></video>' +
        '<div class="infos">Vidéo carrée (mobile, écrans étroits).<br><label class="btn-fichier">Changer la vidéo<input type="file" id="bvVideoMobileFichier" accept="video/mp4"></label></div>' +
      '</div>' +
    '</div>' +

    '<div class="carte">' +
      '<div class="carte-entete"><h2>Lecture de la vidéo</h2></div>' +
      '<div class="grille-champs">' +
        '<div class="champ"><label>Vitesse de lecture</label><input type="range" id="bvVitesse" min="0.1" max="2" step="0.1" value="' + bv.vitesse + '"><div class="valeur-inline" id="bvVitesseVal">' + bv.vitesse + '×</div></div>' +
        '<div class="champ"><label>Pause avant redémarrage</label><input type="number" id="bvPause" min="0" step="100" value="' + bv.pause_ms + '"><div class="valeur-inline">millisecondes</div></div>' +
      '</div>' +
      '<div class="pied-carte"><div class="historique" id="histo-bandeau_video"></div><button class="btn-enregistrer" id="bvEnregistrer">Enregistrer</button></div>' +
    '</div>';

  var videoDesktopActuelle = bv.video_url || '';
  var videoMobileActuelle = bv.video_url_mobile || '';
  function draft(){
    var out = {
      actif: $('bvActif').classList.contains('on'),
      voile: $('bvVoile').classList.contains('on'),
      vitesse: parseFloat($('bvVitesse').value) || 0.6,
      pause_ms: parseInt($('bvPause').value, 10) || 0
    };
    if (videoDesktopActuelle) out.video_url = videoDesktopActuelle;
    if (videoMobileActuelle) out.video_url_mobile = videoMobileActuelle;
    return out;
  }
  function previsualiser(){ envoyerApercu('bandeau_video', draft()); }
  function televerserVideo(input, apercuId, quelle){
    input.addEventListener('change', function(){
      var f = this.files[0]; if (!f) return;
      if (f.type !== 'video/mp4') { toast('Format non supporté — MP4 uniquement.', true); return; }
      if (f.size > 35 * 1024 * 1024) { toast('Vidéo trop lourde (35 Mo max).', true); return; }
      var chemin = 'bandeau-video-' + quelle + '-' + Date.now() + '.mp4';
      toast('Envoi de la vidéo…');
      televerserFichier(f, chemin).then(function(res){
        if (!res.ok || !res.d.url) { toast(res.d && res.d.erreur ? res.d.erreur : 'Envoi impossible.', true); return; }
        if (quelle === 'desktop') videoDesktopActuelle = res.d.url; else videoMobileActuelle = res.d.url;
        $(apercuId).src = res.d.url;
        toast('Vidéo envoyée — Enregistrer pour l\'appliquer.');
        previsualiser();
      }).catch(function(){ toast('Envoi impossible (réseau).', true); });
    });
  }
  televerserVideo($('bvVideoDesktopFichier'), 'bvVideoDesktopApercu', 'desktop');
  televerserVideo($('bvVideoMobileFichier'), 'bvVideoMobileApercu', 'mobile');

  $('bvActif').onclick = function(){ this.classList.toggle('on'); previsualiser(); };
  $('bvVoile').onclick = function(){ this.classList.toggle('on'); previsualiser(); };
  $('bvVitesse').oninput = function(){ $('bvVitesseVal').textContent = parseFloat(this.value).toFixed(1) + '×'; previsualiser(); };
  $('bvPause').oninput = previsualiser;

  $('bvEnregistrer').onclick = function(){
    var btn = this; btn.disabled = true; btn.textContent = 'Enregistrement…';
    enregistrer('bandeau_video', draft()).then(function(){ btn.disabled = false; btn.textContent = 'Enregistrer'; chargerHistorique('bandeau_video', 'histo-bandeau_video', rendreSectionBandeau); });
  };
  chargerHistorique('bandeau_video', 'histo-bandeau_video', rendreSectionBandeau);

  $('bvFichier').addEventListener('change', function(){
    var f = this.files[0]; if (!f) return;
    if (f.size > 4 * 1024 * 1024) { toast('Photo trop lourde (4 Mo max).', true); return; }
    var ext = (f.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
    var chemin = 'bandeau-repli-' + Date.now() + '.' + ext;
    toast('Envoi de la photo…');
    televerserFichier(f, chemin).then(function(res){
      if (!res.ok || !res.d.url) { toast(res.d && res.d.erreur ? res.d.erreur : 'Envoi impossible.', true); return; }
      $('bvMiniature').style.backgroundImage = "url('" + res.d.url + "')";
      var nouvelles = Object.assign({}, reglages.images || {});
      nouvelles.bandeau = res.d.url;
      envoyerApercu('images', nouvelles);
      return enregistrer('images', nouvelles);
    }).catch(function(){ toast('Envoi impossible (réseau).', true); });
  });
}

var COULEURS_TESSELLES_DEFAUT = [['charbon', '#2B353E'], ['terracotta', '#E2725B'], ['kraft', '#CBBD93']];

function rendreSectionTessellesFond(){
  var tf = Object.assign({ actif:true, vitesse:1, quantite:70, taille:1, couleurs:[] }, reglages.tesselles_fond || {});
  var couleursTess = tf.couleurs && tf.couleurs.length === 3 ? tf.couleurs : COULEURS_TESSELLES_DEFAUT.map(function(p){ return p[1]; });

  $('editeur').innerHTML =
    '<p class="fil">Page d\'accueil <span style="opacity:.5">/</span> <b>Tesselles fuyantes</b></p>' +
    '<h1 class="titre-section">Tesselles fuyantes (fond animé)</h1>' +
    '<p class="aide-section">De petites tesselles flottent en arrière-plan de la page d\'accueil, entre le bandeau et le pied de page, et s\'écartent quand le curseur approche. Pas d\'aperçu en direct — la page d\'accueil est trop lourde pour l\'iframe de prévisualisation, ouvrez-la dans un nouvel onglet pour vérifier après enregistrement.</p>' +

    '<div class="carte">' +
      '<div class="toggle-ligne"><div class="toggle-txt"><b>Animation active</b><span>Visible sur la page d\'accueil</span></div><button class="interrupteur' + (tf.actif ? ' on' : '') + '" id="tfActif"><i></i></button></div>' +
    '</div>' +

    '<div class="carte">' +
      '<div class="carte-entete"><h2>Réglages</h2></div>' +
      '<div class="grille-champs">' +
        '<div class="champ"><label>Vitesse</label><input type="range" id="tfVitesse" min="0.3" max="2.5" step="0.1" value="' + tf.vitesse + '"><div class="valeur-inline" id="tfVitesseVal">' + parseFloat(tf.vitesse).toFixed(1) + '×</div></div>' +
        '<div class="champ"><label>Quantité</label><input type="range" id="tfQuantite" min="20" max="150" step="1" value="' + tf.quantite + '"><div class="valeur-inline" id="tfQuantiteVal">' + tf.quantite + '</div></div>' +
        '<div class="champ"><label>Taille</label><input type="range" id="tfTaille" min="0.5" max="2.5" step="0.1" value="' + tf.taille + '"><div class="valeur-inline" id="tfTailleVal">' + parseFloat(tf.taille).toFixed(1) + '×</div></div>' +
      '</div>' +
    '</div>' +

    '<div class="carte">' +
      '<div class="carte-entete"><h2>Couleurs</h2></div>' +
      '<div class="grille-champs">' +
        COULEURS_TESSELLES_DEFAUT.map(function(paire, i){
          var nom = paire[0], val = couleursTess[i];
          return '<div class="champ"><label>' + nom.charAt(0).toUpperCase() + nom.slice(1) + '</label><div class="rang-couleur"><input type="color" id="tfCoul_' + i + '" value="' + val + '"><code id="tfCoul_' + i + 'Hex">' + val + '</code></div></div>';
        }).join('') +
      '</div>' +
      '<div class="pied-carte"><div class="historique" id="histo-tesselles_fond"></div><button class="btn-enregistrer" id="tfEnregistrer">Enregistrer</button></div>' +
    '</div>';

  function draft(){
    var couleurs = [0, 1, 2].map(function(i){ return $('tfCoul_' + i).value; });
    return {
      actif: $('tfActif').classList.contains('on'),
      vitesse: parseFloat($('tfVitesse').value),
      quantite: parseInt($('tfQuantite').value, 10),
      taille: parseFloat($('tfTaille').value),
      couleurs: couleurs
    };
  }
  $('tfActif').onclick = function(){ this.classList.toggle('on'); };
  $('tfVitesse').oninput = function(){ $('tfVitesseVal').textContent = parseFloat(this.value).toFixed(1) + '×'; };
  $('tfQuantite').oninput = function(){ $('tfQuantiteVal').textContent = this.value; };
  $('tfTaille').oninput = function(){ $('tfTailleVal').textContent = parseFloat(this.value).toFixed(1) + '×'; };
  [0, 1, 2].forEach(function(i){
    $('tfCoul_' + i).oninput = function(){ $('tfCoul_' + i + 'Hex').textContent = this.value; };
  });
  $('tfEnregistrer').onclick = function(){
    var btn = this; btn.disabled = true; btn.textContent = 'Enregistrement…';
    enregistrer('tesselles_fond', draft()).then(function(){ btn.disabled = false; btn.textContent = 'Enregistrer'; chargerHistorique('tesselles_fond', 'histo-tesselles_fond', rendreSectionTessellesFond); });
  };
  chargerHistorique('tesselles_fond', 'histo-tesselles_fond', rendreSectionTessellesFond);
}

/* ================= Démarrage : reprise de session si déjà connecté ================= */
try {
  var p0 = sessionStorage.getItem(CLE_SESSION);
  if (p0) {
    rpc('verifier_phrase_panneau', { p_phrase: p0 }).then(function(res){
      if (res.ok && res.d === true) { phrase = p0; entrerDansPanneau(); }
      else sessionStorage.removeItem(CLE_SESSION);
    });
  }
} catch(e){}
</script>
</body>
</html>
