<script>
(function(){
  var MDP = 'qua=dre22TI2008proJet+';
  var CLE = 'quadretiAccesPreview';
  if (localStorage.getItem(CLE) === '1') return;
  document.documentElement.style.visibility = 'hidden';
  document.addEventListener('DOMContentLoaded', function(){
    var voile = document.createElement('div');
    voile.style.cssText = 'position:fixed;inset:0;z-index:999999;background:#1e2b35;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-family:sans-serif;color:#fff;padding:20px;text-align:center;';
    voile.innerHTML = '<div style="font-size:15px;">Site en pr\u00e9paration \u2014 acc\u00e8s r\u00e9serv\u00e9</div>' +
      '<form id="qdtFormAcces" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;"><input type="password" id="qdtMdp" placeholder="Mot de passe" autocomplete="off" style="padding:10px 14px;border-radius:8px;border:none;font-size:14px;min-width:200px;"><button type="submit" style="padding:10px 18px;border-radius:8px;border:none;background:#d96c2f;color:#10181f;font-weight:700;cursor:pointer;">Entrer</button></form>' +
      '<div id="qdtErreur" style="color:#ffb4a6;font-size:12px;display:none;">Mot de passe incorrect.</div>';
    document.body.appendChild(voile);
    document.documentElement.style.visibility = 'visible';
    document.getElementById('qdtMdp').focus();
    document.getElementById('qdtFormAcces').addEventListener('submit', function(e){
      e.preventDefault();
      if (document.getElementById('qdtMdp').value === MDP){
        try { localStorage.setItem(CLE, '1'); } catch(err){}
        voile.remove();
      } else {
        document.getElementById('qdtErreur').style.display = 'block';
        document.getElementById('qdtMdp').value = '';
        document.getElementById('qdtMdp').focus();
      }
    });
  });
})();
</script>

<style>
  /* Bascule de mode integree au bandeau (28/08, demande explicite) : au
     centre entre logo et burger -- grille passee a 3 colonnes/zones nommees.
     Reste une surcouche PROPRE A CETTE PAGE par-dessus commun.css (28/08,
     passage au bandeau partage) : commun.css pose le .qz-header generique
     a 2 colonnes, ces regles le reprennent en 3 colonnes juste ici pour
     faire de la place a la bascule -- voir aussi le petit script juste
     apres l'inclusion de commun-bandeau.js, qui insere le HTML de la
     bascule au bon endroit dans le bandeau une fois qu'il est ecrit. */
  /* 13/09 : les regles de grille ecrites ici (grid-template-areas "logo bascule burger") NE S APPLIQUAIENT PAS — la barre commune
     est en FLEX, pas en grille. Elles ne faisaient rien depuis le debut, et le menu du site n avait donc aucune place reservee : il
     prenait ce qui restait, puis tombait sur deux lignes, CONTACT seul en dessous. Retirees. */

  /* 13/09, demande du fondateur : la bascule de l app descend dans la BANDE DE L ONGLET, sous la barre. Le menu du site retrouve sa
     ligne entiere. La barre fait 58 px et l onglet descend a 98 : la bande fait 40 px, exactement une rangee de boutons — la barre
     remplit donc pile la hauteur de l onglet. */
  /* 13/09, demande du fondateur : la bascule de l app descend dans la BANDE DE L ONGLET, sous la barre, et le menu du site retrouve
     sa ligne entiere. Elle est posee en ABSOLU, pas passee a la ligne : la hauteur de la barre est figee a 58 px en ligne par
     commun-bandeau.js, et la marge de 40 px vient d une feuille chargee apres celle-ci — on ne peut gagner ni contre l une ni contre
     l autre. La barre etant en position relative (l onglet y est deja pose en absolu), 58 px du haut tombe pile dans la bande, qui va
     de 58 a 98 et fait donc 40 px : la hauteur exacte d une rangee de boutons. */
  .qz-header.qz-menu-visible .qz-navpanel>ul{ flex-wrap:nowrap; }
  .bascule{ position:absolute; top:58px; right:3%; height:40px; align-items:center; }
  /* 13/09, demande du fondateur : les deux boutons flottants disparaissent SUR CETTE PAGE. La bulle de contact et le bouton de remontee
     viennent du pied commun ; le reste du site les garde. Le contact reste atteignable par le pied commun, et la
     remontee n a pas d objet ici : la page tient sur un ecran. */
  .qz-fab, .qz-bulle-contact{ display:none !important; }
  /* Sous 901 px la barre se replie et l onglet disparait : la bascule reprend sa place dans le flux, centree. */
  @media (max-width:900px){
    .bascule{ position:static; height:auto; justify-content:center; flex-wrap:wrap; margin:10px 0 0; }
    .qz-header.qz-menu-visible .qz-navpanel>ul{ flex-wrap:wrap; }
  }
</style>
<style>
  /* 13/09 : cette coquille portait encore l identite KRAFT abandonnee (terracotta, charbon, papier) et cinq jetons dont plus aucun
     ne servait depuis le retrait de la rangee de liens du bas. Reduite a ce qu elle utilise vraiment, aux couleurs de la charte. */
  :root{
    --encre:#1E2B35;   /* le bleu de la marque */
    --fond:#DEDEDE;    /* le gris du site */
  }
  *{ box-sizing:border-box; }
  /* 18/09 : le fond passe au navy, comme celui de tout le site. `html body` et non `body` : le panneau de
     controle ecrit sa feuille APRES celle de la page — a egalite on perd, il faut etre PLUS PRECIS. */
  body{ margin:0; background:var(--encre); color:#dedede; font-family:'Jura',sans-serif; }
  html body{ background:var(--encre) !important; color:#dedede !important; }


  /* Bascule de mode -- deux fichiers deja construits/verifies independamment
     (mode decoupe = Canvas, bibliotheque de scenes = Canvas depuis ce soir),
     charges chacun dans son propre cadre isole plutot que fusionnes dans un
     seul DOM. Choix delibere : les deux outils partagent des identifiants
     (menuContextuel, btnEnregistrer...) et une fusion reelle exposerait a des
     collisions -- l'iframe isole chaque page dans son propre document, sans
     rien retoucher a ce qui est deja verifie. Limite assumee : changer de
     mode recharge le cadre, la composition en cours dans l'autre mode n'est
     pas conservee -- pas de partage d'etat entre les deux pour l'instant. */
  /* 13/09 : la barre est en FLEX, pas en grille — grid-area et justify-self ne servaient a rien ici, retires. */
  .bascule{ display:flex; gap:8px; }

  /* 13/09, demande du fondateur : des RECTANGLES, avec le relief et l eclat du CTA de l accueil.
     Ils etaient en pastilles #E2725B — l orange de la charte abandonnee — avec du blanc dessus. */
  .bascule button{
    position:relative; overflow:hidden;
    font-family:'Jura',sans-serif; font-weight:700; font-size:12.5px; cursor:pointer;
    border:none; background:#d96c2f; color:#10181f;   /* 18/09 : la regle du 13/09 preferait le gris au blanc SUR l orange. Les deux sont faux : le gris n y vaut que 2,54, le blanc 3,42. C est l ENCRE qu il faut, 5,23 — c est la paire utilisee par les sept boutons de l accueil. */
    border-radius:8px; padding:8px 18px; line-height:1.15;
    box-shadow:inset 1px 1px 0 rgba(255,255,255,.38), inset -1px -1px 0 rgba(0,0,0,.28), 0 5px 12px rgba(0,0,0,.4);
    transition:box-shadow .18s ease, transform .18s ease, background .15s ease;
  }
  /* l eclat qui balaie le bouton au survol, repris du CTA (bandeau-relief.css) */
  .bascule button::after{
    content:""; position:absolute; top:-30%; bottom:-30%; left:-45%; width:38%; pointer-events:none;
    background:linear-gradient(105deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.55) 50%, rgba(255,255,255,0) 100%);
    transform:translateX(-120%) skewX(-18deg); opacity:0;
  }
  .bascule button:hover::after, .bascule button:focus-visible::after{ animation:bascule-reflet .75s cubic-bezier(.4,0,.2,1) forwards; }
  .bascule button:hover, .bascule button:focus-visible{
    transform:translateY(-1px);
    box-shadow:inset 1px 1px 0 rgba(255,255,255,.5), inset -1px -1px 0 rgba(0,0,0,.28), 0 7px 16px rgba(0,0,0,.45);
  }
  .bascule button:active{ transform:none; box-shadow:inset 2px 2px 4px rgba(0,0,0,.35); }
  /* le bouton actif dit ou l on est : il prend le bleu de la marque, il ne doit pas se confondre avec les deux autres */
  .bascule button.actif{ background:#1e2b35; color:#dedede; }
  @keyframes bascule-reflet{ 0%{ transform:translateX(-120%) skewX(-18deg); opacity:0 } 15%{ opacity:1 } 100%{ transform:translateX(420%) skewX(-18deg); opacity:0 } }
  @media (prefers-reduced-motion:reduce){ .bascule button:hover::after, .bascule button:focus-visible::after{ animation:none } }

  /* Iframe pleine largeur, sans liseré (28/08) : le mode decoupe a bascule
     sur un fond charbon plein ecran -- l'ancien encadrement de l'iframe
     (padding lateral + coins arrondis + fond blanc) laissait un liseré
     blanc visible tout autour, incoherent avec ce nouveau fond sombre.
     Retire, l'iframe colle desormais pleine largeur/hauteur. */
  .zone-cadre{ height:75vh; min-height:460px; }
  iframe{ width:100%; height:100%; border:none; background:var(--encre); display:block; }

  /* 13/09, demande du fondateur : la rangee de liens du bas (« Questions frequentes / Decouvrir les autres outils / Contact ») est
     RETIREE. Le pied commun porte deja Nos outils, Contact et FAQ, trois lignes plus bas — c etait un doublon. Le seul lien sans
     equivalent etait la FAQ de l app : ses cinq questions vivent desormais dans le guide interactif, qui est deja la page d aide et
     l un des trois modes. Styles, fenetre et script correspondants retires avec elle, rien laisse en code mort. */
</style>

<!-- 13/09, demande fondateur : cette app porte son propre logo dans la barre (initiale en tesselles, orange integree), sans accroche
     ni categorie, sur barre navy -- l inverse du site. A declarer AVANT commun-bandeau.js, qui ecrit au fil de la lecture. -->
<script>window.qzApp = { lettre: 'M', nom: 'Mosaïque Quadreti', baseline: 'Choisissez. Colorez. Découpez.' };</script>
<script src="/commun-bandeau.js?v=2026-09-21c"></script>
<script>
  /* Insere la bascule de mode DANS le bandeau partage, entre logo et burger
     (grid-area:bascule, voir la surcouche CSS juste au-dessus). Le bandeau
     commun ne connait pas cette page, donc ne peut pas l'inclure lui-meme --
     ce petit script la rattache juste apres coup, une seule fois, propre a
     cette page. */
  /* grid-area place les elements par nom, pas par ordre DOM -- inserer la
     bascule en dernier enfant suffit, elle atterrit bien au centre. */
  document.querySelector('.qz-header').insertAdjacentHTML('beforeend',
    '<div class="bascule" role="tablist" aria-label="Choisir le mode">' +
      '<button class="actif" id="btnModeDecoupe" role="tab" aria-selected="true" title="Mode découpe" aria-label="Mode découpe">Découpe</button>' +
      '<button id="btnModeScenes" role="tab" aria-selected="false" title="Bibliothèque de scènes" aria-label="Bibliothèque de scènes">Scènes</button>' +
      '<button id="btnModeGuide" role="tab" aria-selected="false" title="Guide interactif" aria-label="Guide interactif">Guide</button>' +
    '</div>'
  );
</script>

<div class="zone-cadre">
  <iframe id="cadre" title="Mosaïque Créative"></iframe>
</div>


<script src="/commun-pied.js?v=2026-09-21c"></script>


<script src="../reglages-site.js?v=2026-09-21c" defer></script>

<script>
(function(){
  var cadre = document.getElementById('cadre');
  var boutons = {
    decoupe: document.getElementById('btnModeDecoupe'),
    scenes: document.getElementById('btnModeScenes'),
    guide: document.getElementById('btnModeGuide')
  };
  var FICHIERS = {
    /* 18/09 : ces deux pages etaient les SEULES du site appelees sans numero de version. Le cadre servait donc
       un outil en cache jusqu a dix minutes apres un depot — un correctif pose ici n arrivait pas. Le numero est
       celui de tous les autres appels du site, a bumper en meme temps. */
    decoupe: 'decoupe.html?v=2026-09-21c',
    scenes: 'scenes.html?v=2026-09-21c',
    guide: 'guide-interactif.html'
  };

  // L'iframe ne commence a charger qu'une fois CETTE page deverrouillee --
  // sinon elle demarre son propre chargement en parallele du garde-acces de
  // la page hote, et affiche sa PROPRE invite de mot de passe avant meme que
  // celle de la page hote soit validee (double invite au tout premier passage,
  // repere en testant). Poll leger plutot qu'un evenement : le script du
  // garde-acces est generique/partage par toutes les pages du site, pas de
  // hook expose a accrocher depuis ici.
  (function demarrerCadreQuandDeverrouille(){
    if (localStorage.getItem('quadretiAccesPreview') === '1') cadre.src = FICHIERS.decoupe;
    else setTimeout(demarrerCadreQuandDeverrouille, 150);
  })();

  function basculer(mode){
    Object.keys(boutons).forEach(function(k){
      boutons[k].classList.toggle('actif', k === mode);
      boutons[k].setAttribute('aria-selected', k === mode);
    });
    cadre.src = FICHIERS[mode];
  }

  boutons.decoupe.addEventListener('click', function(){ basculer('decoupe'); });
  boutons.scenes.addEventListener('click', function(){ basculer('scenes'); });
  boutons.guide.addEventListener('click', function(){ basculer('guide'); });


  /* Expose pour verification/tests. */
  window.__shell = { basculer: basculer, get modeActuel(){ return cadre.src; } };
})();
</script>
