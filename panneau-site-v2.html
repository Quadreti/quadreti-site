<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Panneau V2 — Quadreti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --charbon:#2B353E; --creme:#F2EEDF; --terracotta:#E2725B; --kraft:#CBBD93;
    --fond:#F5F5F5; --surface:#FFFFFF; --bord:#2b353e1c; --texte:#2B353E; --doux:#5c646c;
    --teinte-actif:#e2725b12; --live-dot:#4CAF6D;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--fond); color:var(--texte); font-family:'Karla',sans-serif; font-size:14px; }
  h1,h2,h3,.qz{ font-family:'Quicksand',sans-serif; }
  .cache{ display:none !important; }

  /* ---------- connexion ---------- */
  #blocConnexion{ min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .carte-connexion{ background:var(--surface); border:1px solid var(--bord); border-radius:16px; padding:32px; width:300px; text-align:center; }
  .carte-connexion h1{ font-size:17px; margin:0 0 4px; }
  .carte-connexion p{ font-size:12px; color:var(--doux); margin:0 0 18px; }
  .carte-connexion input{ width:100%; font:inherit; padding:10px 12px; border:1px solid var(--bord); border-radius:8px; margin-bottom:10px; }
  .carte-connexion button{ width:100%; font:inherit; font-family:'Quicksand',sans-serif; font-weight:700; background:var(--charbon); color:var(--creme); border:none; border-radius:9px; padding:11px; cursor:pointer; }

  /* ---------- barre haute ---------- */
  .barre-haut{ display:flex; align-items:center; gap:14px; padding:12px 20px; border-bottom:1px solid var(--bord); background:var(--surface); }
  .barre-haut .qlogo{ display:grid; grid-template-columns:repeat(4,5px); grid-template-rows:repeat(4,5px); gap:1.2px; }
  .barre-haut .qlogo i{ border-radius:1.2px; background:var(--bord); }
  .barre-haut .qlogo i.t{ background:var(--charbon); }
  .barre-haut .qlogo i.a{ background:var(--terracotta); }
  .barre-haut .marque{ font-weight:700; font-size:15px; }
  .barre-haut .sous-marque{ font-size:10.5px; color:var(--doux); margin-top:1px; }
  .badge-v2{ font-weight:700; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; background:var(--teinte-actif); color:var(--terracotta); border-radius:99px; padding:4px 10px; }
  .barre-haut .droite{ margin-left:auto; display:flex; align-items:center; gap:14px; font-size:12px; color:var(--doux); }
  .barre-haut button.lien{ font:inherit; border:none; background:none; color:var(--doux); cursor:pointer; text-decoration:underline; padding:0; }
  #toast{ position:fixed; top:14px; right:20px; z-index:50; background:var(--charbon); color:var(--creme); font-size:12.5px; padding:9px 16px; border-radius:8px; opacity:0; transform:translateY(-6px); transition:opacity .2s,transform .2s; pointer-events:none; }
  #toast.on{ opacity:1; transform:translateY(0); }
  #toast.erreur{ background:#8a3324; }

  .disposition{ display:grid; grid-template-columns:230px 1fr 340px; height:calc(100vh - 53px); min-height:640px; }
  @media (max-width:1100px){ .disposition{ grid-template-columns:200px 1fr 300px; } }

  nav.sommaire{ border-right:1px solid var(--bord); overflow-y:auto; padding:14px 10px 30px; }
  .groupe-nom{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--doux); margin:16px 8px 6px; }
  .groupe-nom:first-child{ margin-top:4px; }
  .item-nav{ display:flex; align-items:center; gap:9px; width:100%; text-align:left; border:none; background:none; color:var(--texte); font:inherit; font-size:13px; padding:8px 9px; border-radius:8px; cursor:pointer; }
  .item-nav:hover:not(:disabled){ background:var(--fond); }
  .item-nav.actif{ background:var(--teinte-actif); color:var(--terracotta); font-weight:600; }
  .item-nav .puce{ width:6px; height:6px; border-radius:50%; background:var(--bord); flex-shrink:0; }
  .item-nav.actif .puce{ background:var(--terracotta); }
  .item-nav:disabled{ color:var(--doux); cursor:default; opacity:.55; }
  .item-nav .bientot{ margin-left:auto; font-size:9px; color:var(--doux); background:var(--fond); border-radius:99px; padding:2px 6px; font-weight:700; }

  .editeur{ overflow-y:auto; padding:24px 30px 60px; }
  .fil{ font-size:11.5px; color:var(--doux); margin-bottom:6px; }
  .fil b{ color:var(--texte); }
  h1.titre-section{ font-size:21px; font-weight:600; margin:0 0 4px; }
  .aide-section{ font-size:12.5px; color:var(--doux); max-width:60ch; margin:0 0 22px; line-height:1.55; }

  .carte{ background:var(--surface); border:1px solid var(--bord); border-radius:14px; padding:18px 20px; margin-bottom:16px; }
  .carte-entete{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; }
  .carte-entete h2{ font-size:14.5px; font-weight:600; margin:0; }

  .grille-champs{ display:grid; grid-template-columns:1fr 1fr; gap:14px 18px; }
  .champ label{ display:block; font-size:11px; font-weight:600; color:var(--doux); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; }
  .champ input[type=number], .champ input[type=range]{ width:100%; font:inherit; font-size:13px; padding:8px 10px; border:1px solid var(--bord); border-radius:8px; background:var(--fond); color:var(--texte); }
  .champ input[type=range]{ padding:0; accent-color:var(--terracotta); height:34px; }
  .champ .valeur-inline{ font-size:11px; color:var(--doux); margin-top:4px; }
  .champ input[type=text], .champ textarea{ width:100%; font:inherit; font-size:13px; padding:8px 10px; border:1px solid var(--bord); border-radius:8px; background:var(--fond); color:var(--texte); }
  .champ textarea{ resize:vertical; min-height:56px; font-family:inherit; }
  .bloc-repete{ padding:14px 0; border-top:1px solid var(--bord); }
  .bloc-repete:first-of-type{ border-top:none; padding-top:2px; }
  .bloc-repete h3{ font-size:12.5px; font-weight:700; margin:0 0 10px; }

  .toggle-ligne{ display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-top:1px solid var(--bord); }
  .toggle-ligne:first-of-type{ border-top:none; padding-top:2px; }
  .toggle-txt b{ display:block; font-size:12.5px; font-weight:600; }
  .toggle-txt span{ font-size:11px; color:var(--doux); }
  .interrupteur{ width:36px; height:20px; border-radius:99px; background:var(--bord); position:relative; flex-shrink:0; border:none; cursor:pointer; padding:0; }
  .interrupteur.on{ background:var(--terracotta); }
  .interrupteur i{ position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:left .15s; }
  .interrupteur.on i{ left:18px; }

  .rang-image{ display:flex; align-items:center; gap:12px; }
  .miniature{ width:64px; height:64px; border-radius:9px; border:1px solid var(--bord); background:var(--fond) center/cover no-repeat; flex-shrink:0; }
  .rang-image .infos{ font-size:11.5px; color:var(--doux); flex:1; }
  .rang-image label.btn-fichier{ font:inherit; font-family:'Quicksand',sans-serif; font-weight:700; font-size:12px; background:var(--fond); border:1px solid var(--bord); border-radius:8px; padding:7px 12px; cursor:pointer; display:inline-block; }
  .rang-image input[type=file]{ display:none; }

  .pied-carte{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:16px; }
  .btn-enregistrer{ font:inherit; font-family:'Quicksand',sans-serif; font-weight:700; font-size:12.5px; background:var(--charbon); color:var(--creme); border:none; border-radius:9px; padding:10px 18px; cursor:pointer; }
  .btn-enregistrer:disabled{ opacity:.5; cursor:default; }
  .historique{ font-size:11.5px; color:var(--doux); display:flex; align-items:center; gap:8px; }
  .historique button.lien{ font:inherit; font-size:11.5px; border:none; background:none; color:var(--terracotta); cursor:pointer; text-decoration:underline; padding:0; }
  .historique button.lien:disabled{ opacity:.5; cursor:default; text-decoration:none; }

  .placeholder-section{ display:flex; flex-direction:column; align-items:flex-start; gap:8px; padding:30px 0; color:var(--doux); font-size:13px; max-width:46ch; line-height:1.6; }
  .placeholder-section button.lien{ font:inherit; border:none; background:none; color:var(--terracotta); cursor:pointer; text-decoration:underline; padding:0; }

  .rang-menu{ display:grid; grid-template-columns:1fr 1fr auto auto auto; gap:10px; align-items:end; margin-bottom:10px; }
  .btn-icone{ font:inherit; font-size:13px; width:32px; height:34px; border:1px solid var(--bord); background:var(--fond); border-radius:8px; cursor:pointer; color:var(--doux); }
  .btn-icone:disabled{ opacity:.35; cursor:default; }
  .btn-icone.suppr{ color:#b04a36; border-color:#b04a3640; }
  .bloc-sous{ margin:2px 0 14px 18px; padding-left:14px; border-left:2px solid var(--bord); }
  .rang-sous{ display:grid; grid-template-columns:1fr 1fr auto; gap:10px; align-items:end; margin-bottom:8px; }
  .btn-texte-ajout{ font:inherit; font-family:'Quicksand',sans-serif; font-weight:700; font-size:12px; background:none; border:1px dashed var(--bord); color:var(--doux); border-radius:8px; padding:8px 14px; cursor:pointer; }

  .colonne-apercu{ border-left:1px solid var(--bord); display:flex; flex-direction:column; background:var(--surface); }
  .apercu-entete{ display:flex; align-items:center; gap:8px; padding:14px 16px; border-bottom:1px solid var(--bord); }
  .live-dot{ width:7px; height:7px; border-radius:50%; background:var(--bord); flex-shrink:0; }
  .live-dot.pret{ background:var(--live-dot); box-shadow:0 0 0 3px #4CAF6D30; }
  .apercu-entete b{ font-size:12.5px; }
  .apercu-entete .sous{ font-size:10.5px; color:var(--doux); }
  .bascule-vue{ margin-left:auto; display:flex; gap:4px; background:var(--fond); border-radius:8px; padding:3px; }
  .bascule-vue button{ border:none; background:none; font-size:14px; padding:5px 9px; border-radius:6px; cursor:pointer; color:var(--doux); }
  .bascule-vue button.actif{ background:var(--surface); color:var(--terracotta); box-shadow:0 1px 2px #0000001a; }
  .cadre-apercu{ flex:1; overflow:auto; padding:18px 14px; display:flex; justify-content:center; align-items:flex-start; }
  .porte-iframe{ overflow:hidden; border-radius:12px; box-shadow:0 8px 26px #00000022; background:#fff; }
  .porte-iframe iframe{ border:none; display:block; transform-origin:top left; }
  .apercu-pied{ padding:12px 16px; border-top:1px solid var(--bord); font-size:11px; color:var(--doux); line-height:1.5; }
  .apercu-pied button.lien{ font:inherit; border:none; background:none; color:var(--terracotta); cursor:pointer; text-decoration:underline; padding:0; font-size:11px; }
</style>
</head>
<body>

<div id="blocConnexion">
  <div class="carte-connexion">
    <div class="qlogo" aria-hidden="true" style="display:grid;grid-template-columns:repeat(4,6px);grid-template-rows:repeat(4,6px);gap:1.5px;margin:0 auto 14px;width:fit-content">
      <i style="background:var(--charbon)"></i><i style="background:var(--charbon)"></i><i style="background:var(--bord)"></i><i style="background:var(--charbon)"></i>
      <i style="background:var(--bord)"></i><i style="background:var(--charbon)"></i><i style="background:var(--bord)"></i><i style="background:var(--charbon)"></i>
      <i style="background:var(--charbon)"></i><i style="background:var(--bord)"></i><i style="background:var(--charbon)"></i><i style="background:var(--bord)"></i>
      <i style="background:var(--charbon)"></i><i style="background:var(--bord)"></i><i style="background:var(--charbon)"></i><i style="background:var(--terracotta)"></i>
    </div>
    <h1>Panneau V2</h1>
    <p>Même phrase secrète que le panneau actuel.</p>
    <input type="password" id="champPhrase" placeholder="Phrase secrète" autocomplete="current-password">
    <button onclick="connexionPhrase()">Entrer</button>
  </div>
</div>

<div id="blocPanneau" class="cache">
  <div class="barre-haut">
    <div class="qlogo" aria-hidden="true"><i class="t"></i><i class="t"></i><i></i><i class="t"></i><i></i><i class="t"></i><i></i><i class="t"></i><i class="t"></i><i></i><i class="t"></i><i></i><i class="t"></i><i></i><i class="t"></i><i class="a"></i></div>
    <div>
      <div class="marque qz">Panneau de contrôle</div>
      <div class="sous-marque">Quadreti — site &amp; boutique</div>
    </div>
    <span class="badge-v2">V2</span>
    <div class="droite">
      <span>Chantier en construction, section par section</span>
      <button class="lien" onclick="deconnexion()">Se déconnecter</button>
    </div>
  </div>

  <div class="disposition">
    <nav class="sommaire" id="sommaire"></nav>

    <main class="editeur" id="editeur"></main>

    <aside class="colonne-apercu">
      <div class="apercu-entete">
        <span class="live-dot" id="liveDot"></span>
        <div><b>Aperçu en direct</b><div class="sous" id="apercuStatut">Chargement…</div></div>
        <div class="bascule-vue">
          <button class="actif" id="vueMobile" onclick="basculerVue('mobile')">📱</button>
          <button id="vueDesktop" onclick="basculerVue('desktop')">🖥</button>
        </div>
      </div>
      <div class="cadre-apercu">
        <div class="porte-iframe" id="porteIframe">
          <iframe id="apercuFrame" src="index.html?apercu_panneau=1" title="Aperçu du site"></iframe>
        </div>
      </div>
      <div class="apercu-pied">Reflète les changements avant même d'enregistrer. <button class="lien" onclick="ouvrirGrand()">Ouvrir en plein écran →</button></div>
    </aside>
  </div>
</div>

<div id="toast"></div>

<script>
/* ================= Backend (même base que panneau-site.html) ================= */
var SB_URL = 'https://dxpwkdzofwcxzolwdggp.supabase.co';
var SB_KEY = 'sb_publishable_EKu_a0eDzPrlkf5W6CuBzg_cxZtSlab';
var FN_UPLOAD = SB_URL + '/functions/v1/televerser-fichier';
var CLE_SESSION = 'quadretiPanneauV2Session';
var $ = function(id){ return document.getElementById(id); };
var phrase = null;
var reglages = {};

function toast(msg, erreur){
  var t = $('toast'); t.textContent = msg;
  t.className = 'on' + (erreur ? ' erreur' : '');
  clearTimeout(t._m); t._m = setTimeout(function(){ t.className=''; }, 3200);
}
function enteteAnon(){ return { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' }; }
function rpc(nom, corps){
  return fetch(SB_URL + '/rest/v1/rpc/' + nom, { method:'POST', headers: enteteAnon(), body: JSON.stringify(corps) })
    .then(function(r){ return r.json().then(function(d){ return { ok:r.ok, d:d }; }); });
}
function televerserFichier(fichier, chemin){
  var fd = new FormData();
  fd.append('phrase', phrase); fd.append('chemin', chemin); fd.append('fichier', fichier);
  return fetch(FN_UPLOAD, { method:'POST', body: fd })
    .then(function(r){ return r.json().then(function(d){ return { ok:r.ok, d:d }; }); });
}

function connexionPhrase(){
  var p = $('champPhrase').value;
  if (!p) { toast('Entrez la phrase secrète.', true); return; }
  rpc('verifier_phrase_panneau', { p_phrase: p }).then(function(res){
    if (!res.ok || res.d !== true) { toast('Phrase incorrecte.', true); return; }
    phrase = p; sessionStorage.setItem(CLE_SESSION, p);
    entrerDansPanneau();
  }).catch(function(){ toast('Connexion impossible.', true); });
}
function deconnexion(){
  phrase = null; sessionStorage.removeItem(CLE_SESSION);
  $('blocPanneau').classList.add('cache'); $('blocConnexion').classList.remove('cache'); $('champPhrase').value = '';
}
function entrerDansPanneau(){
  $('blocConnexion').classList.add('cache'); $('blocPanneau').classList.remove('cache');
  chargerReglages();
}
function chargerReglages(){
  return fetch(SB_URL + '/rest/v1/reglages_site?select=cle,valeur', { headers: enteteAnon() })
    .then(function(r){ return r.json(); })
    .then(function(lignes){
      reglages = {};
      (lignes||[]).forEach(function(l){ reglages[l.cle] = l.valeur; });
      construireSommaire();
      afficherSection('bandeau_video');
    });
}
function enregistrer(cle, valeur){
  return rpc('enregistrer_reglage_admin', { p_cle: cle, p_valeur: valeur, p_phrase: phrase }).then(function(res){
    if (res.ok && res.d === true) { reglages[cle] = valeur; toast('Enregistré — en ligne immédiatement.'); }
    else if (res.ok && res.d === false) { toast('Session expirée : reconnectez-vous.', true); deconnexion(); }
    else toast('Échec de l\'enregistrement.', true);
  }).catch(function(){ toast('Échec de l\'enregistrement (réseau).', true); });
}

/* ================= Historique / undo ================= */
function formaterDelai(iso){
  var s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return 'à l\'instant';
  if (s < 3600) return 'il y a ' + Math.floor(s / 60) + ' min';
  if (s < 86400) return 'il y a ' + Math.floor(s / 3600) + ' h';
  return 'il y a ' + Math.floor(s / 86400) + ' j';
}
/* Widget générique attaché à une carte : propose de revenir à la valeur d'avant le
   dernier enregistrement. Marche pour n'importe quelle cle sans code supplémentaire —
   même table d'historique, alimentée automatiquement par un trigger côté base. */
function chargerHistorique(cle, idConteneur, rendreDeNouveau){
  var conteneur = $(idConteneur);
  if (!conteneur) return;
  conteneur.innerHTML = '<span>Historique…</span>';
  rpc('lister_historique_reglage', { p_cle: cle, p_phrase: phrase, p_limite: 1 }).then(function(res){
    if (!res.ok || !res.d || !res.d.length) { conteneur.innerHTML = '<span>Aucun changement enregistré avant celui-ci.</span>'; return; }
    var ancien = res.d[0];
    conteneur.innerHTML = '<span>Version précédente : ' + formaterDelai(ancien.enregistre_le) + '</span> · <button class="lien" id="btnRestaurer">Revenir à cette version</button>';
    $('btnRestaurer').onclick = function(){
      var btn = this; btn.disabled = true; btn.textContent = 'Restauration…';
      envoyerApercu(cle, ancien.valeur);
      enregistrer(cle, ancien.valeur).then(function(){ rendreDeNouveau(); });
    };
  }).catch(function(){ conteneur.innerHTML = '<span>Historique indisponible (réseau).</span>'; });
}

/* ================= Aperçu en direct (iframe + postMessage) ================= */
var apercuPret = false;
var VUES = {
  mobile:  { largeur:375,  hauteur:700, echelleCol:296 },
  desktop: { largeur:1280, hauteur:760, echelleCol:296 }
};
var vueActuelle = 'mobile';
function dimensionnerIframe(){
  var v = VUES[vueActuelle];
  var echelle = v.echelleCol / v.largeur;
  var f = $('apercuFrame');
  f.style.width = v.largeur + 'px';
  f.style.height = v.hauteur + 'px';
  f.style.transform = 'scale(' + echelle + ')';
  $('porteIframe').style.width = Math.round(v.largeur * echelle) + 'px';
  $('porteIframe').style.height = Math.round(v.hauteur * echelle) + 'px';
}
function basculerVue(v){
  vueActuelle = v;
  $('vueMobile').classList.toggle('actif', v === 'mobile');
  $('vueDesktop').classList.toggle('actif', v === 'desktop');
  dimensionnerIframe();
}
function ouvrirGrand(){ window.open('index.html', '_blank'); }
window.addEventListener('message', function(ev){
  if (ev.source !== $('apercuFrame').contentWindow) return;
  if (ev.data && ev.data.type === 'qz-apercu-pret') {
    apercuPret = true;
    $('liveDot').classList.add('pret');
    $('apercuStatut').textContent = 'Se met à jour à chaque changement';
  }
});
function envoyerApercu(cle, valeur){
  if (!apercuPret) return;
  try { $('apercuFrame').contentWindow.postMessage({ type:'qz-apercu-patch', cle:cle, valeur:valeur }, location.origin); } catch(e){}
}
dimensionnerIframe();

/* ================= Navigation (sommaire) ================= */
var GROUPES = [
  { nom:'Identité visuelle', items:[
    { id:'palette', label:'Palette maîtresse' },
    { id:'polices', label:'Polices' },
    { id:'logo', label:'Logo' }
  ]},
  { nom:'Bandeau & menu', items:[
    { id:'bandeau_video', label:'Bandeau : vidéo ou image', reel:true },
    { id:'menu_liens', label:'Liens du menu', reel:true },
    { id:'menu_nav', label:'Menu (couleurs)' }
  ]},
  { nom:'Page d\'accueil', items:[
    { id:'hero_baseline', label:'Baseline' },
    { id:'sections_accueil', label:'Textes des sections', reel:true },
    { id:'sections_ordre', label:'Visibilité & ordre', reel:true },
    { id:'reassurance', label:'Réassurance' }
  ]},
  { nom:'Boutons', items:[
    { id:'boutons', label:'Textes & liens', reel:true }
  ]},
  { nom:'Widgets', items:[
    { id:'popup', label:'Popup de remise' },
    { id:'bulle_contact', label:'Bulle de contact' }
  ]},
  { nom:'Footer & légal', items:[
    { id:'reseaux', label:'Réseaux sociaux' },
    { id:'copyright', label:'Copyright' }
  ]}
];
function construireSommaire(){
  var nav = $('sommaire'); nav.innerHTML = '';
  GROUPES.forEach(function(groupe){
    var titre = document.createElement('div'); titre.className = 'groupe-nom'; titre.textContent = groupe.nom;
    nav.appendChild(titre);
    groupe.items.forEach(function(item){
      var b = document.createElement('button');
      b.className = 'item-nav'; b.id = 'nav-' + item.id;
      b.innerHTML = '<span class="puce"></span>' + item.label + (item.reel ? '' : '<span class="bientot">bientôt</span>');

}

function rendreSectionOrdre(){
  var titres = {}; SECTIONS_ACCUEIL.forEach(function(d){ titres[d[0]] = d[1]; });

  SECTIONS_ACCUEIL.forEach(function(d){ if (!etat.some(function(e){ return e.id === d[0]; })) etat.push({ id:d[0], visible: visSauve[d[0]] !== false }); });

  function ordreActuel(){ return etat.map(function(e){ return e.id; }); }
  function visActuelle(){ var v = {}; etat.forEach(function(e){ v[e.id] = e.visible; }); return v; }

function escHtml(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function rendreSectionMenu(){

  function dessinerListe(){
    if (!etat.length) {
      return '<div class="placeholder-section">Le menu suit encore la version codée dans chaque page (identique partout). <button class="lien" id="menuReprendre">Reprendre le menu actuel comme point de départ</button></div>';
    }
    var lignes = etat.map(function(item, i){
      var controles = '<button class="btn-icone" data-monter="' + i + '"' + (i === 0 ? ' disabled' : '') + ' title="Monter">↑</button>' +
        '<button class="btn-icone" data-descendre="' + i + '"' + (i === etat.length - 1 ? ' disabled' : '') + ' title="Descendre">↓</button>' +
        '<button class="btn-icone suppr" data-suppr="' + i + '" title="Retirer">✕</button>';

          '</div>';
        }).join('');

          '<div class="champ"><label>Groupe</label><input type="text" data-item-texte="' + i + '" value="' + escHtml(item.texte) + '"></div>' +
          controles +
        '</div><div class="bloc-sous">' + sousLignes + '<button class="btn-texte-ajout" data-ajout-sous="' + i + '">+ sous-lien</button></div></div>';
      }
      return '<div class="bloc-repete"><div class="rang-menu">' +
        '<div class="champ"><label>Texte</label><input type="text" data-item-texte="' + i + '" value="' + escHtml(item.texte) + '"></div>' +
        '<div class="champ"><label>Destination</label><input type="text" data-item-lien="' + i + '" value="' + escHtml(item.lien) + '"></div>' +

      '<h1 class="titre-section">Liens du menu</h1>' +
      '<p class="aide-section">Les entrées du menu principal, dans l\'ordre où elles apparaissent — identique sur les 22 pages du site. Les destinations commencent par « / » (ex. <code>/boutique/</code>, <code>/contact.html</code>).</p>' +
      '<div class="carte" id="menuCarte">' + dessinerListe() + '</div>' +

    if (ajouter) ajouter.onclick = function(){ etat.push({ texte:'Nouveau lien', lien:'/' }); dessiner(); };
    document.querySelectorAll('[data-monter]').forEach(function(b){ b.onclick = function(){ var i = +b.dataset.monter; var t = etat[i-1]; etat[i-1] = etat[i]; etat[i] = t; dessiner(); }; });
    document.querySelectorAll('[data-descendre]').forEach(function(b){ b.onclick = function(){ var i = +b.dataset.descendre; var t = etat[i+1]; etat[i+1] = etat[i]; etat[i] = t; dessiner(); }; });

    document.querySelectorAll('[data-ajout-sous]').forEach(function(b){ b.onclick = function(){ etat[+b.dataset.ajoutSous].sousMenu.push({ texte:'Nouveau sous-lien', lien:'/' }); dessiner(); }; });

    document.querySelectorAll('[data-sous-lien]').forEach(function(c){ c.oninput = function(){ var p = c.dataset.sousLien.split(','); etat[+p[0]].sousMenu[+p[1]].lien = c.value; envoyerApercu('menu_liens', etat); }; });
    var enr = $('menuEnregistrer');
    if (enr) enr.onclick = function(){
      enr.disabled = true; enr.textContent = 'Enregistrement…';
      enregistrer('menu_liens', etat).then(function(){ enr.disabled = false; enr.textContent = 'Enregistrer le menu'; chargerHistorique('menu_liens', 'histo-menu_liens', rendreSectionMenu); });
    };
    chargerHistorique('menu_liens', 'histo-menu_liens', rendreSectionMenu);
  }

  dessiner();
}

      '<div class="carte-entete"><h2>Lecture de la vidéo</h2></div>' +

    };

    }).catch(function(){ toast('Envoi impossible (réseau).', true); });
  });
