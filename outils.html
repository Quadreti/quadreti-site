<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<!-- GARDE-ACCES-DEBUT -->
<script>
(function(){
  var MDP = 'qua=dre22TI2008proJet+';
  var CLE = 'quadretiAccesPreview';
  if (localStorage.getItem(CLE) === '1') return;
  document.documentElement.style.visibility = 'hidden';
  document.addEventListener('DOMContentLoaded', function(){
    var voile = document.createElement('div');
    voile.style.cssText = 'position:fixed;inset:0;z-index:999999;background:#1e2b35;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-family:sans-serif;color:#fff;padding:20px;text-align:center;';
    voile.innerHTML = '<div style="font-size:15px;">Site en préparation — accès réservé</div>' +
      '<form id="qdtFormAcces" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;"><input type="password" id="qdtMdp" placeholder="Mot de passe" autocomplete="off" style="padding:10px 14px;border-radius:8px;border:none;font-size:14px;min-width:200px;"><button type="submit" style="padding:10px 18px;border-radius:8px;border:none;background:#E2725B;color:#fff;font-weight:700;cursor:pointer;">Entrer</button></form>' +
      '<div id="qdtErreur" style="color:#ffb4a6;font-size:12px;display:none;">Mot de passe incorrect.</div>';
    document.body.appendChild(voile);
    document.documentElement.style.visibility = 'visible';
    document.getElementById('qdtMdp').focus();
    document.getElementById('qdtFormAcces').addEventListener('submit', function(e){
      e.preventDefault();
      if (document.getElementById('qdtMdp').value === MDP){
        try { localStorage.setItem(CLE, '1'); } catch(err){}
        voile.remove();
      } else {
        document.getElementById('qdtErreur').style.display = 'block';
        document.getElementById('qdtMdp').value = '';
        document.getElementById('qdtMdp').focus();
      }
    });
  });
})();
</script>
<!-- GARDE-ACCES-FIN -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quadreti — Studio de création</title>
<meta name="description" content="Le Studio de création QuadretI : composez votre mosaïque, créez vos QR codes, préparez vos photos — chaque outil fait une chose et la fait bien.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jura:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/commun.css">
<link rel="stylesheet" href="/prisme-outils.css">
<style>
  /* 13/09, demande du fondateur : le menu est sur gris, donc le CONTENU est sur bleu — l inversion de la charte, appliquee a la page.
     Le selecteur passe par l identifiant que le corps porte deja : la feuille que le panneau injecte a l execution pose body{...} a
     specificite 0,0,1 et arrive apres celle-ci ; body#qz-top (0,1,1) la bat sans avoir besoin d un !important. */
  body#qz-top{ margin:0; background:#1e2b35; font-family:'Jura',sans-serif; color:#dedede; }
  .wrap{ max-width:1060px; margin:0 auto; padding:0 22px; }
  .rv{ opacity:0; transform:translateY(22px); transition:opacity .6s ease, transform .6s ease; }
  .rv.in{ opacity:1; transform:none; }
  @media (prefers-reduced-motion:reduce){ .rv{ transition:none; opacity:1; transform:none; } }
  /* 13/09, demande du fondateur : « remonte tout le bloc ». L air au-dessus du titre tombe a 18 px. Toute la place rendue va au
     prisme, qui la prend de lui-meme : sa hauteur est calculee sur ce qui reste sous le titre. */
  section.blk{ padding:18px 0; }
  #outils-hero{ padding-bottom:0; }
  .blk h1{ margin-bottom:0; }
  .center{ text-align:center; }
  .eyebrow{ font-family:'Jura',sans-serif; font-weight:700; font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:#9c4514; margin-bottom:10px;   /* 13/09 : un mot orange sur fond clair prend la version foncee — l orange de marque est fait pour les fonds */ }
  /* 13/09 : ces deux regles passent par l identifiant de la section, expres. La feuille que le panneau injecte a l execution pose
     body{color:#fff} et .eyebrow{color:#a39c92} ; elle arrive apres celle-ci et gagnerait a specificite egale — le titre partait
     en blanc sur gris (contraste 1,35) et le surtitre en beige (2,02). Un identifiant la met hors de portee : la page reste juste
     quelle que soit la palette enregistree. La palette du panneau, elle, reste a corriger de son cote. */
  #outils-hero h1{ color:#dedede; }              /* le gris du site, pose sur le bleu du site */
  #outils-hero .eyebrow{ color:#f0a06a; }        /* l orange eclairci : le #d96c2f de marque ne donne que 3,97 sur le bleu, trop juste pour du texte */
  .blk h1{ font-family:'Jura',sans-serif; font-size:clamp(22px,2.5vw,30px);   /* 13/09 : un cran plus petit, la place va au prisme */ font-weight:700; letter-spacing:-.01em; line-height:1.15; margin:0 0 14px; }

  .icon{ width:20px; height:20px; display:block; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

  /* 14/09 : l habillage du prisme vit desormais dans /prisme-outils.css — l accueil s en sert aussi (« le prisme remplace la
     presentation ancienne »), il ne peut pas exister en deux exemplaires. Seuls les jetons propres a CETTE page restent ici. */

  /* 13/09, demande du fondateur : le bloc « Jeux & coloriages » quitte cette page — « je trouve qu elle n a pas sa place ici ». Il
     rejoint le MENU du site, en rubrique a part (voir commun-bandeau.js). La phrase sur le compte unique est retiree elle aussi.
     Leurs styles partent avec eux : rien ne sert a rien ici. */
  }
</style>
</head>
<body id="qz-top">
<!-- ===== BANDEAU COMMUN (source : quadreti-bloc-commun_1.html) ===== -->
<script src="/commun-bandeau.js"></script>
<!-- ===== BANDEAU COMMUN — FIN ===== -->

<section class="blk" id="outils-hero">
  <div class="wrap center">
    <div class="eyebrow">L'écosystème QuadretI</div>
    <h1>Studio de création</h1>
    <!-- 13/09, demande du fondateur : le chapo est retire. Le titre annonce, les cartes disent — une phrase entre les deux ne faisait
         que repousser le prisme vers le bas. -->
  </div>
</section>

<!-- ===== LES CINQ OUTILS, SUR UN PRISME (13/09, piste B validee par le fondateur) =====
     Cinq faces, pas six : les jeux, les coloriages et Pixel Number ne sont pas des outils (arbitrage du fondateur) — ils sont
     passes dans le MENU du site. Le prisme tourne ; sous 900 px, ou si le visiteur demande moins d animation, il redevient une
     liste. Chaque face reste un article complet, lisible meme sans la rotation. -->
<section class="blk" id="outils-prisme" style="padding-top:0">
  <div class="wrap">
      <!-- 14/09 : le prisme est ecrit par /prisme-outils.js, qui declare aussi les cinq outils. Jamais en defer ni async : il
           ecrit au fil de la lecture, exactement ici. -->
      <script src="/prisme-outils.js"></script>

  </div>
</section>

<!-- ===== FOOTER COMMUN (source : quadreti-bloc-commun_1.html) ===== -->
<script src="/commun-pied.js"></script>
<!-- ===== FOOTER COMMUN — FIN ===== -->

<script>
  if (window.matchMedia && !matchMedia('(prefers-reduced-motion: reduce)').matches && 'IntersectionObserver' in window) {
    var obs = new IntersectionObserver(function(entries){
      entries.forEach(function(e){ if (e.isIntersecting) { e.target.classList.add('in'); obs.unobserve(e.target); } });
    }, { threshold: 0.15 });
    document.querySelectorAll('.rv').forEach(function(el){ obs.observe(el); });
  } else {
    document.querySelectorAll('.rv').forEach(function(el){ el.classList.add('in'); });
  }
</script>
<script src="reglages-site.js" defer></script>
</body>
</html>
