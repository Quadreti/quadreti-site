<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<!-- GARDE-ACCES-DEBUT -->
<script>
(function(){
  var MDP = 'qua=dre22TI2008proJet+';
  var CLE = 'quadretiAccesPreview';
  if (localStorage.getItem(CLE) === '1') return;
  document.documentElement.style.visibility = 'hidden';
  document.addEventListener('DOMContentLoaded', function(){
    var voile = document.createElement('div');
    voile.style.cssText = 'position:fixed;inset:0;z-index:999999;background:#1e2b35;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-family:sans-serif;color:#fff;padding:20px;text-align:center;';
    voile.innerHTML = '<div style="font-size:15px;">Site en pr\u00e9paration \u2014 acc\u00e8s r\u00e9serv\u00e9</div>' +
      '<form id="qdtFormAcces" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;"><input type="password" id="qdtMdp" placeholder="Mot de passe" autocomplete="off" style="padding:10px 14px;border-radius:8px;border:none;font-size:14px;min-width:200px;"><button type="submit" style="padding:10px 18px;border-radius:8px;border:none;background:#d96c2f;color:#10181f;font-weight:700;cursor:pointer;">Entrer</button></form>' +
      '<div id="qdtErreur" style="color:#ffb4a6;font-size:12px;display:none;">Mot de passe incorrect.</div>';
    document.body.appendChild(voile);
    document.documentElement.style.visibility = 'visible';
    document.getElementById('qdtMdp').focus();
    document.getElementById('qdtFormAcces').addEventListener('submit', function(e){
      e.preventDefault();
      if (document.getElementById('qdtMdp').value === MDP){
        try { localStorage.setItem(CLE, '1'); } catch(err){}
        voile.remove();
      } else {
        document.getElementById('qdtErreur').style.display = 'block';
        document.getElementById('qdtMdp').value = '';
        document.getElementById('qdtMdp').focus();
      }
    });
  });
})();
</script>
<!-- GARDE-ACCES-FIN -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Créer votre mot de passe — Quadreti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jura:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* 18/09 : la page vivait sur la palette Kraft abandonnee. Elle passe dans le langage du site.
     Les noms de jetons sont ceux d origine — les renommer par leur role demanderait de toucher chaque regle,
     et cette page tient en cinquante lignes : le gain serait nul, le risque pas. */
  :root{
    --charbon:#dedede;        /* devenu LE TEXTE : 10,75 sur le fond, 7,59 sur la carte */
    --creme:#10181f;          /* devenu L ENCRE : ce qu on pose sur l orange (5,23) ou sur un champ clair */
    --terracotta:#d96c2f;     /* l orange de marque : les surfaces, jamais l ecriture */
    --terracotta-f:#df824e;
    --fond:#1e2b35;           /* le navy de marque */
    --carte:#33434f;          /* navy 2 */
    --champ:#dedede;          /* un champ reste CLAIR : on y tape un mot de passe a l aveugle */
    --adouci:#b6c0c8;         /* le secondaire : 5,53 sur la carte */
    --bord:#dedede26;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; background:var(--fond); color:var(--charbon); font-family:'Jura',sans-serif; font-size:15px;
    display:flex; align-items:center; justify-content:center; padding:24px; }
  .carte{ background:var(--carte); border:1px solid var(--bord); border-radius:14px; padding:26px 26px 24px; max-width:380px; width:100%; }
  h1{ font-family:'Jura',sans-serif; font-size:17px; font-weight:700; margin:0 0 6px; }
  p.aide{ font-size:13px; color:var(--adouci); margin:0 0 18px; }
  label{ display:block; font-size:12.5px; font-weight:600; color:var(--adouci); margin:10px 0 4px; }
  input{ width:100%; padding:9px 12px; border:1.5px solid var(--champ); border-radius:9px; font:inherit; background:var(--champ); color:#10181f; }
  input:focus{ outline:2px solid var(--terracotta); outline-offset:1px; }
  button{ font-family:'Jura',sans-serif; font-weight:700; font-size:13.5px; border:none; border-radius:10px; padding:11px 18px;
    cursor:pointer; background:var(--terracotta); color:var(--creme); width:100%; margin-top:16px; }
  button:hover{ background:var(--terracotta-f); }
  button:disabled{ opacity:.5; cursor:default; }
  a{ color:#ff9147; font-weight:600; }   /* l orange ECRIT : 6,47 ; l orange de marque n y vaut que 4,23 */
  /* Le rouge d erreur etait un rouge SOMBRE, pense pour un fond clair : 1,5 sur le navy. Il est saturé vers le
     clair, comme l orange — sur fond sombre on eclaircit en saturant.
     CORRIGE dans la foulee : j avais calcule sur le navy NU (7,21). Mais la boite se donne elle-meme un fond
     teinte a 12 %, et c est SUR CE FOND COMPOSITE qu il faut mesurer — la vraie valeur etait 4,13, sous le seuil.
     Un fond translucide n est pas un detail : il change ce que le texte a reellement derriere lui. 4,83. */
  #erreur{ background:#ff9d8e1f; border:1px solid #ff9d8e55; color:#ffb3a6; border-radius:9px; padding:10px 12px; font-size:13px; margin-top:14px; }
  #ok{ background:#d96c2f1f; border:1px solid #d96c2f66; border-radius:9px; padding:14px; font-size:13.5px; }
  .cache{ display:none !important; }
</style>
</head>
<body>
<div class="carte">
  <div id="blocFormulaire">
    <h1>Créer votre mot de passe</h1>
    <p class="aide">Ce mot de passe servira à vous connecter au panneau du site.</p>
    <label for="mdp1">Nouveau mot de passe</label>
    <input type="password" id="mdp1" autocomplete="new-password">
    <label for="mdp2">Confirmez-le</label>
    <input type="password" id="mdp2" autocomplete="new-password">
    <button id="btnValider">Enregistrer</button>
    <div id="erreur" class="cache"></div>
  </div>
  <div id="blocOk" class="cache">
    <div id="ok"></div>
  </div>
  <div id="blocLienInvalide" class="cache">
    <div id="erreur">Ce lien n'est plus valable (déjà utilisé, ou trop ancien). Retournez sur le panneau et redemandez un lien.</div>
  </div>
</div>
<script>
'use strict';
var SB_URL = 'https://dxpwkdzofwcxzolwdggp.supabase.co';
var SB_KEY = 'sb_publishable_EKu_a0eDzPrlkf5W6CuBzg_cxZtSlab';

function paramsHash(){
  var h = location.hash.replace(/^#/, '');
  var p = {};
  h.split('&').forEach(function(kv){
    var i = kv.indexOf('=');
    if (i > -1) p[decodeURIComponent(kv.slice(0,i))] = decodeURIComponent(kv.slice(i+1));
  });
  return p;
}
var accessToken, type;

function demarrer(){
  var params = paramsHash();
  accessToken = params.access_token;
  type = params.type;

  if (!accessToken || (type !== 'recovery' && type !== 'invite')) {
    document.getElementById('blocFormulaire').classList.add('cache');
    document.getElementById('blocLienInvalide').classList.remove('cache');
    return;
  }
  document.getElementById('btnValider').addEventListener('click', function(){
    var m1 = document.getElementById('mdp1').value, m2 = document.getElementById('mdp2').value;
    var err = document.getElementById('erreur');
    err.classList.add('cache');
    if (m1.length < 8) { err.textContent = 'Au moins 8 caractères.'; err.classList.remove('cache'); return; }
    if (m1 !== m2) { err.textContent = 'Les deux mots de passe ne correspondent pas.'; err.classList.remove('cache'); return; }
    var btn = document.getElementById('btnValider'); btn.disabled = true; btn.textContent = 'Enregistrement...';
    fetch(SB_URL + '/auth/v1/user', {
      method: 'PUT',
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: m1 })
    }).then(function(r){ return r.json().then(function(d){ return { ok:r.ok, d:d }; }); })
      .then(function(res){
        if (!res.ok) throw new Error((res.d && res.d.msg) || 'échec');
        document.getElementById('blocFormulaire').classList.add('cache');
        document.getElementById('ok').innerHTML = 'Mot de passe créé. <a href="panneau-site.html">Aller au panneau du site →</a>';
        document.getElementById('blocOk').classList.remove('cache');
      })
      .catch(function(){
        err.textContent = 'Échec de l\'enregistrement. Réessayez ou redemandez un lien.';
        err.classList.remove('cache');
        btn.disabled = false; btn.textContent = 'Enregistrer';
      });
  });
}

if (document.readyState === 'complete') demarrer();
else window.addEventListener('load', demarrer);
</script>
</body>
</html>
