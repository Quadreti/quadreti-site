<script>
(function(){
  var MDP = 'qua=dre22TI2008proJet+';
  var CLE = 'quadretiAccesPreview';
  if (localStorage.getItem(CLE) === '1') return;
  document.documentElement.style.visibility = 'hidden';
  document.addEventListener('DOMContentLoaded', function(){
    var voile = document.createElement('div');
    voile.style.cssText = 'position:fixed;inset:0;z-index:999999;background:#1e2b35;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-family:sans-serif;color:#fff;padding:20px;text-align:center;';
    voile.innerHTML = '<div style="font-size:15px;">Site en pr\u00e9paration \u2014 acc\u00e8s r\u00e9serv\u00e9</div>' +
      '<form id="qdtFormAcces" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;"><input type="password" id="qdtMdp" placeholder="Mot de passe" autocomplete="off" style="padding:10px 14px;border-radius:8px;border:none;font-size:14px;min-width:200px;"><button type="submit" style="padding:10px 18px;border-radius:8px;border:none;background:#E2725B;color:#fff;font-weight:700;cursor:pointer;">Entrer</button></form>' +
      '<div id="qdtErreur" style="color:#ffb4a6;font-size:12px;display:none;">Mot de passe incorrect.</div>';
    document.body.appendChild(voile);
    document.documentElement.style.visibility = 'visible';
    document.getElementById('qdtMdp').focus();
    document.getElementById('qdtFormAcces').addEventListener('submit', function(e){
      e.preventDefault();
      if (document.getElementById('qdtMdp').value === MDP){
        try { localStorage.setItem(CLE, '1'); } catch(err){}
        voile.remove();
      } else {
        document.getElementById('qdtErreur').style.display = 'block';
        document.getElementById('qdtMdp').value = '';
        document.getElementById('qdtMdp').focus();
      }
    });
  });
})();
</script>

<style>
  /* Charte identique au site : memes variables, memes graisses, meme en-tete.
     Toute couleur de cette page vient d'ici — rien n'est ecrit en dur ailleurs. */
  :root{
    --terracotta:#E2725B;
    --terracotta-soft:#F6DED8;
    --olive:#556B2F;
    --olive-soft:#E9EDDD;
    --kraft:#CBBD93;
    --kraft-soft:#F1ECDD;
    --charbon:#2b353e;
    --fond:#F5F5F5;
    --blanc:#FFFFFF;
    --border:#E3E0DA;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family:'Quicksand', -apple-system, "Segoe UI", Arial, sans-serif;
    background:var(--fond); color:var(--charbon);
    font-size:15px; line-height:1.55;
  }

  /* ===== Ticker (harmonisation du 20/08/2026 — identique à l'accueil) ===== */
  .ticker{ background:var(--charbon); color:#fff; overflow:hidden; padding:9px 0; }
  .ticker-track{ display:flex; width:max-content; animation:tickerScroll 22s linear infinite; }
  .ticker-track span{
    font-size:11.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; opacity:.92;
    padding:0 26px; border-right:1px solid rgba(255,255,255,.22); white-space:nowrap;
  }
  @keyframes tickerScroll{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
  @media (prefers-reduced-motion: reduce){ .ticker-track{ animation:none; overflow-x:auto; } }

  /* ===== Menu sandwich (harmonisation du 20/08/2026 — identique à l'accueil, remplace
     l'ancien .mainnav de cette page) ===== */
  .burger{
    width:37px; height:37px; border-radius:8px; border:1.5px solid var(--border); background:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; cursor:pointer;
  }
  .burger span{ width:15px; height:2px; background:var(--charbon); border-radius:2px; }
  .mobile-menu{
    display:none; flex-direction:column; gap:2px;
    position:sticky; top:67px; z-index:49;
    background:#fff; border-bottom:1px solid var(--border);
    padding:10px 18px 16px;
  }
  .mobile-menu.open{ display:flex; }
  .mobile-menu a{
    text-decoration:none; color:var(--charbon); font-weight:700; font-size:15px;
    padding:11px 8px; border-bottom:1px solid var(--fond);
  }
  .mobile-menu .mm-cta{
    margin-top:12px; text-align:center; background:var(--charbon); color:#fff;
    border-radius:99px; padding:13px; border-bottom:none;
  }

  /* ===== En-tete : copie conforme de celui du site ===== */
  header.site{
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    padding:15px 26px; border-bottom:1px solid var(--border);
    position:sticky; top:0; background:rgba(255,255,255,.94); backdrop-filter:blur(6px); z-index:50;
  }
  .logo-row{ display:flex; align-items:flex-start; gap:13px; text-decoration:none; color:inherit; }
  .wordmark-col{ display:flex; flex-direction:column; gap:5px; line-height:1; padding-top:1px; }
  .wordmark{ font-weight:600; font-size:19px; }
  .wordmark .i-dot{ position:relative; display:inline-block; }
  .wordmark .accent-dot{ position:absolute; left:50%; top:0.02em; transform:translateX(-50%); width:.16em; height:.16em; border-radius:.035em; background:var(--terracotta); }
  .category{
    font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color:var(--terracotta); white-space:nowrap;
  }
  .qlogo{ display:grid; grid-template-columns:repeat(4,7px); grid-auto-rows:7px; gap:1.3px; }
  .qlogo i{ display:block; border-radius:1.5px; background:var(--charbon); }
  /* Header uniquement (pas le footer, qui n'a pas de ligne catégorie) : icône agrandie pour
     que son bas s'aligne avec le bas de la catégorie (.wordmark-col = 36px de haut). */
  .logo-row:not(.foot-logo) .qlogo{ grid-template-columns:repeat(4, 7.93px); grid-auto-rows:7.93px; gap:1.43px; }
  .logo-row:not(.foot-logo) .qlogo i{ border-radius:1.75px; }
  .qlogo i.empty{ visibility:hidden; }
  .qlogo i.t{ background:var(--terracotta); }
  .mainnav{ display:flex; align-items:center; gap:22px; flex-wrap:wrap; }
  .mainnav a{ color:var(--charbon); text-decoration:none; font-weight:600; font-size:14.5px; }
  .mainnav a:hover{ color:var(--terracotta); }
  .nav-cta{

    font-weight:700; border-radius:99px; padding:9px 20px;
  }

     sociaux + cartouches légales + footer logo/baseline centré + bouton retour en haut. */

  .section-reseaux .accroche{ font-family:'Quicksand',sans-serif; font-weight:600; font-size:20px; color:var(--fond); margin:0 0 4px; }

  .section-reseaux a{

    box-shadow:0 10px 18px rgba(0,0,0,.35);

  }
  @media (max-width:520px){
    .section-reseaux .grid{ grid-template-columns:repeat(5, 1fr); gap:12px; max-width:320px; }
  }

  .foot-legal{ background:#1f272e; padding:32px 22px 40px; border-top:2px solid var(--terracotta); }
  .foot-legal .wrap{
    max-width:1320px; margin:0 auto;
    display:flex; flex-wrap:wrap; justify-content:center; gap:20px;
  }
  .foot-legal a{
    display:flex; align-items:center; justify-content:center; gap:10px;
    background:#2d363f; border:1px solid rgba(226,114,91,.28); border-radius:12px;
    padding:14px 22px; text-decoration:none; color:#e5e1e1;
    font-size:13px; font-weight:600;
    transition:background .15s, border-color .15s; flex:0 1 auto;

  .foot-legal a:hover{ background:#37434e; border-color:rgba(226,114,91,.5); }
  .foot-legal a svg{ width:18px; height:18px; flex:0 0 auto; fill:none; stroke:var(--terracotta); stroke-width:1.7; }

  footer{ background:#1f272e; color:#aab2ba; padding:30px 22px 34px; border-top:1px solid rgba(255,255,255,.06); }
  .foot{ max-width:1060px; margin:0 auto; display:flex; justify-content:center; align-items:center; }
  .foot-brand{ display:flex; flex-direction:column; gap:11px; align-items:center; text-align:center; }

  .foot-logo .qlogo i{ background:var(--fond); }

  .foot-logo .wordmark{ color:var(--fond); }
  .foot-baseline{ font-size:12px; color:var(--terracotta); }

  .to-top{
    position:fixed; right:20px; bottom:20px; z-index:60;
    width:44px; height:44px; border-radius:50%; border:none;
    background:var(--charbon); color:#fff; box-shadow:0 8px 20px rgba(0,0,0,.28);
    display:flex; align-items:center; justify-content:center;

  .to-top.show{ opacity:1; pointer-events:auto; transform:none; }
  .to-top:hover{ background:var(--terracotta); }
  .to-top svg{ width:18px; height:18px; fill:none; stroke:#fff; stroke-width:2.2; }

  @media (max-width:640px){
    header.site{ padding:12px 15px; gap:10px; }
    .mainnav{ gap:14px; width:100%; justify-content:center; }
    .shop-head{ padding-top:30px; }
    .shop{ padding:16px 12px 54px; }
  }

<script>
(function(){
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const burger = document.getElementById('burger');
  const mobileMenu = document.getElementById('mobileMenu');
  if (burger && mobileMenu){
    burger.addEventListener('click', () => {
      const open = mobileMenu.classList.toggle('open');
      burger.setAttribute('aria-expanded', open);
      burger.setAttribute('aria-label', open ? 'Fermer le menu' : 'Ouvrir le menu');
    });
    mobileMenu.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
      mobileMenu.classList.remove('open');
      burger.setAttribute('aria-expanded', 'false');
    }));
  }

  const toTop = document.getElementById('toTop');
  if (toTop){
    window.addEventListener('scroll', () => {
      toTop.classList.toggle('show', window.scrollY > 600);
    }, { passive: true });
    toTop.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
    });
  }
})();
</script>
