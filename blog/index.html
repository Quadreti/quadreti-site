<script>
(function(){

  var CLE = 'quadretiAccesPreview';
  if (localStorage.getItem(CLE) === '1') return;
  document.documentElement.style.visibility = 'hidden';

    var voile = document.createElement('div');
    voile.style.cssText = 'position:fixed;inset:0;z-index:999999;background:#2B353E;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-family:sans-serif;color:#fff;padding:20px;text-align:center;';

<script>
'use strict';
var SB_URL = 'https://dxpwkdzofwcxzolwdggp.supabase.co';
var SB_KEY = 'sb_publishable_EKu_a0eDzPrlkf5W6CuBzg_cxZtSlab';
fetch(SB_URL + '/rest/v1/articles_blog?select=slug,titre,extrait,image,date_publication&statut=eq.publie&order=date_publication.desc', {
  headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY }
}).then(function(r){ return r.json(); }).then(function(articles){
  var grille = document.getElementById('blogGrille');
  if (!articles || !articles.length) {
    grille.innerHTML = "<p class=\"blog-vide\">Aucun article pour l'instant — revenez bientôt.</p>";
    return;
  }
  grille.textContent = '';
  articles.forEach(function(a){
    var carte = document.createElement('a');
    carte.className = 'blog-carte';
    carte.href = 'article.html?slug=' + encodeURIComponent(a.slug);
    var img = a.image ? '<img src="' + a.image + '" alt="">' : '';
    var date = new Date(a.date_publication + 'T00:00:00').toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' });
    carte.innerHTML = img +
      '<div class="corps"><span class="date"></span><h2></h2><p></p></div>';
    carte.querySelector('.date').textContent = date;
    carte.querySelector('h2').textContent = a.titre;
    carte.querySelector('p').textContent = a.extrait;
    grille.appendChild(carte);
  });
}).catch(function(){
  document.getElementById('blogGrille').innerHTML = "<p class=\"blog-vide\">Impossible de charger les articles pour l'instant.</p>";
});
</script>

<script>
/* Bloc commun — seul JS embarqué : ouverture/fermeture du volet menu
   (aucune animation en JS, conformément à la consigne CSS pur). */
(function(){
  var btn = document.getElementById('qzMenuBtn');
  var panel = document.getElementById('qzNavPanel');
  var voile = document.getElementById('qzNavVoile');
  if(btn && panel){
    btn.addEventListener('click', function(){
      var willOpen = !panel.classList.contains('open');
      if(willOpen && getComputedStyle(panel).position === 'fixed'){
        var hdr = document.querySelector('.qz-header');
        if(hdr) panel.style.top = hdr.getBoundingClientRect().bottom + 'px';
      }
      panel.classList.toggle('open', willOpen);
      btn.classList.toggle('active', willOpen);
      btn.setAttribute('aria-expanded', String(willOpen));
      btn.setAttribute('aria-label', willOpen ? 'Fermer le menu' : 'Ouvrir le menu');
      if(voile) voile.classList.toggle('open', willOpen);
      if(!willOpen){
        document.querySelectorAll('.qz-hassub.open').forEach(function(it){
          it.classList.remove('open');
          var tog = it.querySelector('.qz-subtoggle');
          if(tog) tog.setAttribute('aria-expanded','false');
        });
      }
    });
  }
  if(voile){
    voile.addEventListener('click', function(){
      if(btn) btn.click();
    });
  }
  document.querySelectorAll('.qz-hassub').forEach(function(item){
    var toggle = item.querySelector('.qz-subtoggle');
    if(!toggle) return;
    toggle.addEventListener('click', function(){
      var open = !item.classList.contains('open');
      item.classList.toggle('open', open);
      toggle.setAttribute('aria-expanded', String(open));
    });
  });
})();
</script>
