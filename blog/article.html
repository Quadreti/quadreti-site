<script>
'use strict';
var SB_URL = 'https://dxpwkdzofwcxzolwdggp.supabase.co';
var SB_KEY = 'sb_publishable_EKu_a0eDzPrlkf5W6CuBzg_cxZtSlab';

/* Sanitisation : ne garde que les balises attendues, retire tout attribut
   non autorisé — même si le contenu vient uniquement du panneau protégé
   par phrase secrète, on ne fait jamais confiance en aval du réseau. */
function nettoyerHtml(html){
  var autorises = { P:[], BR:[], B:[], STRONG:[], I:[], EM:[], H3:[], A:['href'] };
  var div = document.createElement('div');
  div.innerHTML = html;
  (function nettoyer(noeud){
    Array.prototype.slice.call(noeud.childNodes).forEach(function(enfant){
      if (enfant.nodeType === 1) {
        var tag = enfant.tagName;
        if (tag === 'SCRIPT' || tag === 'STYLE') { noeud.removeChild(enfant); return; }
        if (!autorises.hasOwnProperty(tag)) {
          while (enfant.firstChild) noeud.insertBefore(enfant.firstChild, enfant);
          noeud.removeChild(enfant);
          return;
        }
        Array.prototype.slice.call(enfant.attributes).forEach(function(attr){
          if (autorises[tag].indexOf(attr.name) === -1) enfant.removeAttribute(attr.name);
        });
        if (tag === 'A') {
          var href = enfant.getAttribute('href') || '';
          if (!/^https?:\/\//i.test(href)) enfant.removeAttribute('href');
          enfant.setAttribute('target', '_blank');
          enfant.setAttribute('rel', 'noopener');
        }
        nettoyer(enfant);
      } else if (enfant.nodeType !== 3) {
        noeud.removeChild(enfant);
      }
    });
  })(div);
  return div.innerHTML;
}

var params = new URLSearchParams(location.search);
var slug = params.get('slug');
var zone = document.getElementById('zoneArticle');
if (!slug) {
  zone.innerHTML = '<p class="blog-vide">Article introuvable. <a href="index.html">Retour au blog</a></p>';
} else {
  fetch(SB_URL + '/rest/v1/articles_blog?select=titre,extrait,contenu,image,date_publication&statut=eq.publie&slug=eq.' + encodeURIComponent(slug), {
    headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY }
  }).then(function(r){ return r.json(); }).then(function(rows){
    var a = rows && rows[0];
    if (!a) { zone.innerHTML = '<p class="blog-vide">Article introuvable ou plus disponible. <a href="index.html">Retour au blog</a></p>'; return; }
    document.getElementById('titrePage').textContent = a.titre + ' — Blog Quadreti';
    document.getElementById('metaDescription').content = a.extrait || '';
    var date = new Date(a.date_publication + 'T00:00:00').toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' });
    zone.innerHTML =
      '<a class="retour" href="index.html">&larr; Retour au blog</a>' +
      (a.image ? '<img class="couverture" src="' + a.image + '" alt="">' : '') +
      '<span class="date"></span><h1></h1>' +
      '<div class="contenu"></div>';
    zone.querySelector('.date').textContent = date;
    zone.querySelector('h1').textContent = a.titre;
    zone.querySelector('.contenu').innerHTML = nettoyerHtml(a.contenu || '');
  }).catch(function(){
    zone.innerHTML = "<p class=\"blog-vide\">Impossible de charger cet article pour l'instant.</p>";
  });
}
</script>
